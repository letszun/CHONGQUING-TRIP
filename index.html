function initSnapRail(id){
  const root=document.getElementById(id); if(!root) return;
  const rail=root.querySelector('.snap-rail');
  const dots=[...root.querySelectorAll('.snap-dot')];
  const count=root.querySelector('.snap-count');
  const progress=root.querySelector('.snap-progress-fill');
  const prev=root.querySelector('[data-snap-prev]');
  const next=root.querySelector('[data-snap-next]');
  if(!rail) return;
  const cards=[...rail.children];
  let active=0, raf=0;

  const cardLeft=(i)=>Math.max(0,cards[i].offsetLeft-rail.offsetLeft-2);
  const goTo=(i,behavior='smooth')=>{
    const target=Math.max(0,Math.min(cards.length-1,i));
    rail.scrollTo({left:cardLeft(target),behavior});
  };
  const update=()=>{
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const center=rail.scrollLeft+rail.clientWidth/2;
      let best=0,dist=Infinity;
      cards.forEach((card,i)=>{const c=card.offsetLeft-rail.offsetLeft+card.offsetWidth/2;const d=Math.abs(c-center);if(d<dist){dist=d;best=i}});
      active=best;
      dots.forEach((dot,i)=>dot.classList.toggle('active',i===active));
      if(count) count.textContent=`${String(active+1).padStart(2,'0')} / ${String(cards.length).padStart(2,'0')}`;
      if(progress) progress.style.width=`${((active+1)/cards.length)*100}%`;
      if(prev) prev.disabled=active===0;
      if(next) next.disabled=active===cards.length-1;
    });
  };

  rail.addEventListener('scroll',update,{passive:true});
  dots.forEach((dot,i)=>dot.onclick=()=>goTo(i));
  if(prev) prev.onclick=()=>goTo(active-1);
  if(next) next.onclick=()=>goTo(active+1);

  // Desktop: click-and-drag. Touch devices keep native scrolling, avoiding scroll jank.
  let dragging=false,startX=0,startScroll=0,pid=null;
  rail.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.target.closest('button,a,input,textarea,select,label')) return;
    dragging=true;pid=e.pointerId;startX=e.clientX;startScroll=rail.scrollLeft;rail.classList.add('is-dragging');
    try{rail.setPointerCapture(pid)}catch(_){ }
  });
  rail.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==pid)return;rail.scrollLeft=startScroll-(e.clientX-startX)});
  const endDrag=()=>{dragging=false;rail.classList.remove('is-dragging')};
  rail.addEventListener('pointerup',endDrag);rail.addEventListener('pointercancel',endDrag);
  update();
}

function initCardDeck(id,start=0){
  const root=document.getElementById(id); if(!root) return;
  const stage=root.querySelector('.deck-stage'); if(!stage) return;
  const cards=[...stage.querySelectorAll('.deck-card')]; if(!cards.length) return;
  let current=Math.max(0,Math.min(start,cards.length-1));
  let dragging=false,startX=0,dx=0,pointerId=null;
  const interactiveSel='button,a,textarea,input,select,label';
  const paint=()=>{
    cards.forEach((card,i)=>{
      const diff=(i-current+cards.length)%cards.length;
      card.classList.remove('is-top','is-next','is-third','is-hidden');
      card.style.opacity='1';
      card.style.pointerEvents='auto';
      if(diff===0){card.classList.add('is-top'); card.style.transform=`translate3d(${dx}px,0,0) rotate(${dx/20}deg) scale(1)`;}
      else if(diff===1){card.classList.add('is-next'); card.style.transform='translate3d(0,18px,0) scale(.97)';}
      else if(diff===2){card.classList.add('is-third'); card.style.transform='translate3d(0,34px,0) scale(.94)';}
      else{card.classList.add('is-hidden'); card.style.transform='translate3d(0,52px,0) scale(.91)'; card.style.opacity='.05'; card.style.pointerEvents='none';}
    });
    root.querySelectorAll('.deck-dot').forEach((d,i)=>d.classList.toggle('active',i===current));
  };
  const commit=(dir)=>{dx=0;dragging=false;if(dir==='next') current=(current+1)%cards.length; else if(dir==='prev') current=(current-1+cards.length)%cards.length;cards.forEach(c=>c.classList.remove('dragging'));paint();};
  const reset=()=>{dx=0;dragging=false;cards.forEach(c=>c.classList.remove('dragging'));paint();};
  stage.onpointerdown=(e)=>{if(e.target.closest(interactiveSel)) return;dragging=true;pointerId=e.pointerId;startX=e.clientX;dx=0;const top=cards[current]; if(top){top.classList.add('dragging'); try{top.setPointerCapture(pointerId)}catch(_){}}};
  stage.onpointermove=(e)=>{if(!dragging||e.pointerId!==pointerId) return;dx=e.clientX-startX;paint();};
  stage.onpointerup=(e)=>{if(!dragging||e.pointerId!==pointerId) return;if(dx<-70) commit('next'); else if(dx>70) commit('prev'); else reset();};
  stage.onpointercancel=reset;
  root.querySelectorAll('[data-dir]').forEach(btn=>btn.onclick=()=>commit(btn.dataset.dir));
  root.querySelectorAll('.deck-dot').forEach(btn=>btn.onclick=()=>{current=Number(btn.dataset.go)||0; reset();});
  paint();
}


function initSplash(){
  const splash=document.getElementById('splashScreen');
  if(!splash) return;
  const seen=sessionStorage.getItem('cqSplashSeen');
  if(seen){splash.classList.add('is-hidden'); setTimeout(()=>splash.remove(),420); return;}
  document.body.classList.add('splash-lock');
  requestAnimationFrame(()=>splash.classList.add('is-active'));
  setTimeout(()=>{
    splash.classList.add('is-hidden');
    document.body.classList.remove('splash-lock');
    sessionStorage.setItem('cqSplashSeen','1');
    setTimeout(()=>splash.remove(),560);
  },1050);
}

function route(){const hash=(location.hash||'#today').slice(1);const p=hash.split('/');if(p[0]==='detail'){renderDetail(p[1],p[2],p[3]);show('detail');nav(p[3]||'plan');return}
  const view=['today','plan','spots','eat','book','money','talk','check','maybe','more','weather','emergency'].includes(p[0])?p[0]:'today';
  if(view==='today') renderToday();
  if(view==='plan') renderPlan();
  if(view==='spots') renderSpots();
  if(view==='eat') renderEat();
  if(view==='book') renderBook();
  if(view==='money') renderMoney();
  if(view==='talk') renderTalk();
  if(view==='check') renderCheck();
  if(view==='maybe') renderMaybe();
  if(view==='more') renderMore();
  if(view==='weather') renderWeather();
  if(view==='emergency') renderEmergency();
  show(view); nav(view);
}
window.addEventListener('hashchange',route); route(); initSplash();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{}));
