<title>Chongqing Atlas</title>
<style>
:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%}body{min-width:0}button,input,textarea,select,a{font:inherit;outline:none}button{cursor:pointer}a{text-decoration:none;color:inherit}.app{max-width:430px;margin:0 auto;min-height:100vh;padding:14px 14px 112px;overflow-x:hidden}.view{display:none;min-width:0}.view.active{display:block}.stack{display:grid;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}.card{min-width:0;border:0;border-radius:var(--r);padding:16px;background:var(--paper);box-shadow:var(--shadow);color:var(--ink)}.pink{background:var(--pink)}.mint{background:var(--mint)}.lav{background:var(--lav)}.lime{background:var(--lime)}.blue{background:var(--blue);color:#fff}.muted{color:var(--muted)}
/* typography */
.hero{padding:18px;border-radius:28px;background:var(--paper);box-shadow:var(--shadow);min-width:0}.hero.pink{background:var(--pink)}.hero.mint{background:var(--mint)}.hero.lav{background:var(--lav)}.hero .meta{display:flex;justify-content:space-between;gap:12px;font-size:10px;font-weight:700;color:var(--muted);line-height:1.35}.display{margin-top:10px;font-size:42px;line-height:.92;font-weight:820;letter-spacing:-.065em;text-wrap:balance;word-break:keep-all}.title{font-size:27px;line-height:1.12;font-weight:800;letter-spacing:-.045em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}.body{font-size:14px;line-height:1.68;word-break:keep-all;text-wrap:pretty}.micro{font-size:10px;line-height:1.35;color:var(--muted);font-weight:650}.balanced{text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}.pretty{text-wrap:pretty;word-break:keep-all;overflow-wrap:anywhere}
/* nav */
.bottom-nav{position:fixed;z-index:80;left:50%;bottom:12px;transform:translateX(-50%);width:min(402px,calc(100vw - 22px));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;border-radius:999px;background:rgba(20,20,22,.94);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 34px rgba(0,0,0,.38);backdrop-filter:blur(18px)}.nav-btn{height:44px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.5);font-size:11px;font-weight:740;letter-spacing:-.01em}.nav-btn.active{background:var(--paper);color:var(--ink)}
/* today */
.next-card{border:0;text-align:left}.next-card .time{font-size:31px;font-weight:820;letter-spacing:-.05em;line-height:1}.next-card b{display:block;margin-top:12px;font-size:19px;line-height:1.24;text-wrap:balance;word-break:keep-all}.next-card small{display:block;margin-top:5px;font-size:12px;line-height:1.5;opacity:.62}.today-list{display:grid;gap:8px}.today-row{width:100%;min-width:0;border:0;border-radius:19px;padding:13px;display:grid;grid-template-columns:54px minmax(0,1fr) 16px;gap:9px;background:var(--paper);text-align:left;color:var(--ink)}.today-row:nth-child(4n+1){background:var(--mint)}.today-row:nth-child(4n+2){background:var(--pink)}.today-row:nth-child(4n+3){background:var(--lav)}.today-row time{font-size:11px;font-weight:760;padding-top:2px}.today-row b{display:block;font-size:15px;line-height:1.35;font-weight:780;text-wrap:pretty;word-break:keep-all}.today-row small{display:block;margin-top:4px;font-size:12px;line-height:1.48;color:var(--muted);word-break:keep-all}
/* plan */
.plan-card{display:grid;gap:12px}.plan-head{display:flex;justify-content:space-between;font-size:10px;font-weight:720;color:var(--muted)}.plan-date{font-size:37px;line-height:.95;font-weight:830;letter-spacing:-.055em}.plan-name{font-size:24px;line-height:1.16;font-weight:820;letter-spacing:-.04em;text-wrap:balance;word-break:keep-all}.plan-place{font-size:13px;line-height:1.55;color:var(--muted);word-break:keep-all}.plan-events{display:grid;gap:7px}.plan-event{width:100%;min-width:0;border:0;border-radius:17px;padding:11px 12px;display:grid;grid-template-columns:52px minmax(0,1fr) 15px;gap:9px;background:rgba(255,255,255,.72);color:var(--ink);text-align:left}.plan-event time{font-size:11px;font-weight:760;padding-top:2px}.plan-event b{display:block;font-size:14px;line-height:1.4;font-weight:780;text-wrap:pretty;word-break:keep-all}.plan-event small{display:block;margin-top:3px;font-size:11px;line-height:1.5;color:var(--muted);word-break:keep-all}.plan-foot{display:grid;grid-template-columns:1fr 1fr;gap:8px}.plan-foot>div{padding:12px;border-radius:16px;background:rgba(255,255,255,.68);min-width:0}.plan-foot span{font-size:9px;font-weight:720;color:var(--muted)}.plan-foot b{display:block;margin-top:5px;font-size:12px;line-height:1.48;font-weight:740;word-break:keep-all;text-wrap:pretty}
/* spots/eat */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.filter{border:0;border-radius:999px;padding:9px 13px;background:rgba(23,23,25,.08);color:var(--muted);font-size:11px;font-weight:720;appearance:none}.filter.active{background:var(--ink);color:#fff}.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item-card{min-width:0;min-height:150px;border:0;border-radius:22px;padding:15px;text-align:left;display:flex;flex-direction:column;background:var(--paper);box-shadow:var(--shadow);color:var(--ink)}.item-card:nth-child(4n+2){background:var(--pink)}.item-card:nth-child(4n+3){background:var(--mint)}.item-card:nth-child(4n){background:var(--lav)}.item-card b{font-size:21px;line-height:1.08;font-weight:820;letter-spacing:-.04em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}.item-card small{margin-top:8px;font-size:12px;line-height:1.45;color:var(--muted);word-break:keep-all}.item-card em{margin-top:auto;padding-top:12px;font-size:11px;font-style:normal;color:var(--muted)}
/* map */
.map-wrap{display:grid;gap:12px}.map-card{background:var(--paper);border-radius:26px;padding:13px;box-shadow:var(--shadow);overflow:hidden}.map-title{display:flex;justify-content:space-between;align-items:center;padding:3px 3px 10px}.map-title b{font-size:16px}.map-title span{font-size:10px;color:var(--muted)}.map-canvas{overflow:hidden;border-radius:21px;background:#e9e5df}.spot-map{width:100%;display:block}.map-paper{fill:#e9e5df}.map-road{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.9}.map-river{fill:none;stroke:#cbd4dc;stroke-width:23;stroke-linecap:round}.map-pin circle{fill:var(--ink);stroke:#fff;stroke-width:3}.map-pin text{fill:#fff;font-size:10px;font-weight:800;font-family:Arial,sans-serif}.map-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.map-legend button{border:0;border-radius:14px;padding:9px 10px;background:#ece8e2;text-align:left;display:grid;grid-template-columns:23px 1fr;gap:5px;color:var(--ink);min-width:0}.map-legend button:nth-child(4n+2){background:var(--pink)}.map-legend button:nth-child(4n+3){background:var(--mint)}.map-legend button:nth-child(4n){background:var(--lav)}.map-legend span{grid-row:1/3;font-size:9px;font-weight:760;color:var(--muted)}.map-legend b{font-size:11px;line-height:1.3;word-break:keep-all}.map-legend em{font-size:9px;line-height:1.3;font-style:normal;color:var(--muted)}
/* more */
.more-list{display:grid;gap:9px}.more-item{border:0;border-radius:22px;padding:15px;display:grid;grid-template-columns:minmax(0,1fr) 16px;gap:10px;text-align:left;color:var(--ink);box-shadow:var(--shadow)}.more-item b{display:block;font-size:19px;line-height:1.12;font-weight:800;letter-spacing:-.035em}.more-item small{display:block;margin-top:4px;font-size:11px;line-height:1.42;color:var(--muted)}
/* common secondary */
.secondary-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px;color:rgba(255,255,255,.48);font-size:10px;font-weight:720}.back{border:1px solid rgba(255,255,255,.08);border-radius:999px;padding:9px 12px;background:rgba(255,255,255,.06);color:#fff;font-size:10px;font-weight:720}.secondary-title{font-size:39px;line-height:.92;font-weight:830;letter-spacing:-.06em;color:#fff;margin:0 0 16px 2px}.sub-title{font-size:29px;line-height:1;font-weight:820;color:#fff;margin:34px 0 12px 2px}.field{background:var(--paper);border-radius:20px;padding:13px;box-shadow:var(--shadow);min-width:0}.field label{display:block;margin-bottom:7px;font-size:9px;font-weight:760;color:var(--muted)}.field textarea,.field input,.field select{width:100%;min-width:0;border:0;border-radius:13px;background:#ebe8e2;color:var(--ink);padding:11px 12px;font-size:14px;line-height:1.55}.field textarea{min-height:64px;resize:vertical}.field textarea::placeholder,.field input::placeholder{color:rgba(23,23,25,.36)}
/* bookings simplified */
.booking-list{display:grid;gap:11px}.booking{border-radius:24px;padding:15px;box-shadow:var(--shadow);min-width:0;overflow:hidden}.booking.blue{background:var(--blue);color:#fff}.booking-top{display:flex;justify-content:space-between;gap:10px;font-size:9px;font-weight:720;opacity:.62}.booking-title{margin-top:10px;font-size:22px;line-height:1.22;font-weight:810;letter-spacing:-.035em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}.booking-meta{display:grid;gap:3px;margin-top:10px;font-size:12px;line-height:1.58;opacity:.66;word-break:keep-all;text-wrap:pretty}.booking-note{margin-top:7px;font-size:12px;line-height:1.58;opacity:.7;word-break:keep-all}.booking-open{margin-top:12px;font-size:10px;font-weight:740;opacity:.7}.booking .field{margin-top:12px;background:rgba(255,255,255,.86);color:var(--ink);box-shadow:none}.booking:not(.blue) .field{background:rgba(255,255,255,.52)}.links-min{margin-top:10px;border-radius:16px;background:rgba(255,255,255,.46);padding:10px}.blue .links-min{background:rgba(255,255,255,.13)}.links-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.links-head span{font-size:9px;font-weight:720;opacity:.58}.links-head button{border:0;border-radius:999px;padding:7px 10px;background:var(--ink);color:#fff;font-size:10px;font-weight:720}.blue .links-head button{background:#fff;color:var(--ink)}.saved-link{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(23,23,25,.1);font-size:12px}.blue .saved-link{border-color:rgba(255,255,255,.16)}.saved-link a{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.saved-link button{border:0;background:transparent;color:inherit;opacity:.45;font-size:10px}.link-editor{display:grid;gap:7px;margin-top:9px}.link-editor input{width:100%;border:0;border-radius:11px;padding:9px 10px;background:rgba(255,255,255,.68);color:var(--ink)}.link-actions{display:flex;gap:6px}.link-actions button{border:0;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:720}.link-actions .save{background:var(--ink);color:#fff}.link-actions .cancel{background:rgba(255,255,255,.48);color:var(--ink)}
/* money */
.money-total{background:var(--pink);border-radius:26px;padding:18px;box-shadow:var(--shadow);margin-bottom:10px}.money-total span{font-size:9px;font-weight:720;color:var(--muted)}.money-total b{display:block;margin-top:25px;font-size:49px;line-height:.86;font-weight:830;letter-spacing:-.065em}.money-total em{font-size:10px;font-weight:720;color:var(--muted);font-style:normal}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:9px 0}.info{background:var(--paper);border-radius:18px;padding:13px;box-shadow:var(--shadow)}.info span{display:block;font-size:10px;color:var(--muted)}.info b{display:block;margin-top:6px;font-size:14px;line-height:1.4}.add-expense{border:0;border-radius:19px;background:var(--blue);color:#fff;padding:14px;text-align:left;font-size:11px;font-weight:760;box-shadow:var(--shadow)}.expense-list{display:grid;gap:9px;margin-top:9px}.expense{display:flex;justify-content:space-between;gap:12px;background:var(--paper);border-radius:18px;padding:13px;box-shadow:var(--shadow)}.expense b,.expense strong{font-size:13px}.expense span{display:block;margin-top:3px;font-size:10px;color:var(--muted)}.expense>div:last-child{text-align:right}.expense button{margin-top:6px;border:0;background:transparent;color:var(--muted);font-size:10px}
/* talk/check/maybe */
.talk-list,.check-list,.maybe-list{display:grid;gap:9px}.talk{border-radius:22px;padding:15px;box-shadow:var(--shadow)}.talk-ko{font-size:16px;line-height:1.4;font-weight:790;word-break:keep-all}.talk-zh{margin-top:6px;font-size:14px;line-height:1.55;opacity:.7}.talk button{margin-top:10px;border:0;border-radius:999px;padding:8px 11px;background:var(--ink);color:#fff;font-size:10px;font-weight:720}.check{display:flex;gap:11px;align-items:flex-start;background:var(--paper);border-radius:18px;padding:13px;box-shadow:var(--shadow)}.check input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--blue)}.check span{font-size:13px;line-height:1.5;word-break:keep-all;text-wrap:pretty}.check.done{opacity:.45}.maybe-card{border:0;border-radius:22px;padding:15px;box-shadow:var(--shadow);color:var(--ink);text-align:left;min-width:0}.maybe-card b{display:block;font-size:20px;line-height:1.18;font-weight:800;text-wrap:balance;word-break:keep-all}.maybe-card small{display:block;margin-top:6px;font-size:12px;line-height:1.5;color:var(--muted);word-break:keep-all}.maybe-card em{display:block;margin-top:13px;font-size:11px;font-style:normal;color:var(--muted)}
/* details */
.detail-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;color:rgba(255,255,255,.48);font-size:10px;font-weight:720}.detail-head{border-radius:26px;padding:17px;box-shadow:var(--shadow);min-width:0}.detail-head h1{margin:9px 0 0;font-size:29px;line-height:1.16;font-weight:820;letter-spacing:-.045em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}.detail-head p{margin:9px 0 0;font-size:12px;line-height:1.5;color:var(--muted);word-break:keep-all}.detail-section{border-radius:22px;padding:15px;background:var(--paper);box-shadow:var(--shadow);min-width:0}.detail-section>span{display:block;margin-bottom:9px;font-size:9px;font-weight:740;color:var(--muted)}.detail-section .body{margin:0}.detail-list{display:grid;gap:8px}.detail-list>div{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding-top:8px;border-top:1px solid rgba(23,23,25,.1)}.detail-list>div:first-child{border-top:0;padding-top:0}.detail-list i{font-size:9px;font-style:normal;color:var(--muted)}.detail-list b{font-size:13px;line-height:1.55;font-weight:690;word-break:keep-all;text-wrap:pretty}.fact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fact{border-radius:18px;padding:12px;background:var(--paper);box-shadow:var(--shadow);min-width:0}.fact span{font-size:9px;color:var(--muted)}.fact b{display:block;margin-top:5px;font-size:12px;line-height:1.35;word-break:keep-all}.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool-grid button,.tool-grid a{border:0;border-radius:14px;padding:12px;background:rgba(255,255,255,.74);color:var(--ink);font-size:11px;font-weight:730;text-align:left}.memo-dark{width:100%;min-height:74px;border:0;border-radius:15px;padding:12px 13px;background:#1b1b1e;color:#fff;font-size:14px;line-height:1.6;resize:vertical}.memo-dark::placeholder{color:rgba(255,255,255,.76)}
/* hotel details mobile-safe */
.hotel-detail{min-width:0;max-width:100%;overflow-x:hidden}.hotel-head{background:var(--lav);border-radius:26px;padding:17px;box-shadow:var(--shadow);min-width:0}.hotel-head h1{margin:12px 0 0;font-size:27px;line-height:1.22;font-weight:820;letter-spacing:-.035em;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}.hotel-head p{margin:9px 0 0;font-size:11px;line-height:1.56;color:var(--muted);overflow-wrap:anywhere}.address-card{background:var(--paper);border-radius:26px;padding:17px;box-shadow:var(--shadow);min-width:0;max-width:100%;overflow:hidden}.address-card>span{font-size:9px;font-weight:720;color:var(--muted)}.cn-address{margin-top:22px;font-size:27px;line-height:1.22;font-weight:820;letter-spacing:-.035em;word-break:keep-all;text-wrap:balance;overflow-wrap:anywhere;max-width:100%}.en-address{margin-top:12px;font-size:11px;line-height:1.58;color:var(--muted);overflow-wrap:anywhere;word-break:normal}.hotel-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hotel-actions button,.hotel-actions a{min-width:0;border:0;border-radius:16px;padding:12px;background:var(--paper);color:var(--ink);font-size:10px;font-weight:720;text-align:left;box-shadow:var(--shadow)}.hotel-actions button:first-child{background:var(--blue);color:#fff}
/* weather emergency */
.weather-list{display:grid;gap:9px}.weather-card{border-radius:22px;padding:15px;background:var(--paper);box-shadow:var(--shadow)}.weather-card b{font-size:17px}.weather-card strong{display:block;margin-top:14px;font-size:36px;line-height:1}.weather-card span{display:block;margin-top:6px;font-size:12px;color:var(--muted)}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action-grid button,.action-grid a{border:0;border-radius:17px;padding:13px;background:var(--paper);color:var(--ink);font-size:11px;font-weight:720;text-align:left;box-shadow:var(--shadow)}.action-grid button{background:var(--blue);color:#fff}.emergency-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.emergency-grid a{border-radius:20px;padding:13px;background:var(--paper);box-shadow:var(--shadow)}.emergency-grid a:nth-child(1){background:var(--pink)}.emergency-grid a:nth-child(2){background:var(--lime)}.emergency-grid a:nth-child(3){background:var(--blue);color:#fff}.emergency-grid span{font-size:9px;opacity:.6}.emergency-grid b{display:block;margin-top:20px;font-size:26px}
/* keep lines balanced and never clip horizontally */
.title,.booking-title,.plan-name,.item-card b,.detail-head h1,.hotel-head h1,.cn-address,.maybe-card b,.today-row b,.plan-event b{max-width:100%;min-width:0}
@supports(text-wrap:balance){.title,.booking-title,.plan-name,.item-card b,.detail-head h1,.hotel-head h1,.cn-address,.maybe-card b{ text-wrap:balance }}
@supports(text-wrap:pretty){.body,.booking-meta,.today-row b,.plan-event b,.check span,.detail-list b{ text-wrap:pretty }}
@media(max-width:390px){.app{padding-left:13px;padding-right:13px}.item-grid,.grid2,.plan-foot,.info-grid,.tool-grid,.hotel-actions,.action-grid,.map-legend{grid-template-columns:1fr}.fact-grid{grid-template-columns:1fr 1fr}.fact-grid .fact:last-child{grid-column:1/-1}.emergency-grid{grid-template-columns:1fr 1fr}.emergency-grid a:last-child{grid-column:1/-1}.cn-address{font-size:25px}}

/* v50 — real map engine + detail image + food order tip */
.detail-image{height:218px;border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:var(--shadow);min-width:0}
.detail-image img{width:100%;height:100%;display:block;object-fit:cover}
.food-guide{background:var(--mint)!important}
.food-guide-copy{margin:0 0 12px;font-size:13px;line-height:1.65;color:var(--ink);word-break:keep-all;text-wrap:pretty}
.food-phrase-list{display:grid;gap:7px}
.food-phrase{width:100%;border:0;border-radius:15px;padding:11px 12px;background:rgba(255,255,255,.72);color:var(--ink);text-align:left;display:grid;grid-template-columns:minmax(0,1fr) 18px;gap:9px;align-items:center}
.food-phrase b{display:block;font-size:14px;line-height:1.42;font-weight:780;word-break:keep-all;text-wrap:pretty}
.food-phrase small{display:block;margin-top:3px;font-size:11px;line-height:1.45;color:var(--muted);word-break:keep-all;text-wrap:pretty}
.food-phrase i{font-size:12px;font-style:normal;opacity:.55}
/* Leaflet map containers */
.real-map-wrap{display:grid;gap:12px}
.real-map-card{background:var(--paper);border-radius:26px;padding:13px;box-shadow:var(--shadow);overflow:hidden}
.real-map-title{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:3px 3px 10px}
.real-map-title b{font-size:15px;line-height:1.2;font-weight:790;letter-spacing:-.025em}.real-map-title span{font-size:10px;color:var(--muted)}

function ensureLeaflet(){
  if(window.L) return Promise.resolve(window.L);
  if(window.__leafletPromise) return window.__leafletPromise;
  if(!document.querySelector('link[data-leaflet]')){
    const l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';l.dataset.leaflet='1';document.head.appendChild(l);
  }
  window.__leafletPromise=new Promise((resolve,reject)=>{
    const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';s.async=true;s.dataset.leaflet='1';
    s.onload=()=>resolve(window.L);s.onerror=()=>reject(new Error('Leaflet load failed'));document.head.appendChild(s);
  });
  return window.__leafletPromise;
}

function nextEvent(day){
  const now=new Date(),key=`${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  if(day.date!==key)return day.events[0];
  const cur=now.getHours()*60+now.getMinutes();
  return day.events.find(e=>{const m=/^(\d{2}):(\d{2})$/.exec(e[0]);return m&&(Number(m[1])*60+Number(m[2])>=cur)})||day.events[day.events.length-1];
}

function renderTalk(filter='ALL'){const cats=[['ALL','전체'],['HOTEL','숙소'],['MOVE','이동'],['FOOD','식당'],['PAY','결제'],['ETC','기타']];const rows=PHRASES.filter(x=>filter==='ALL'||x[2]===filter);document.getElementById('talk').innerHTML=`${sec('TALK')}<div class="filters">${cats.map(([c,l])=>`<button class="filter ${filter===c?'active':''}" onclick="renderTalk('${c}')">${l}</button>`).join('')}</div><div class="talk-list" style="margin-top:10px">${rows.map((x,i)=>`<article class="talk ${tone(i)}"><div class="talk-ko">${x[0]}</div><div class="talk-zh">${x[1]}</div><button onclick="copyText('${x[1]}')">COPY</button></article>`).join('')}</div>`}
function renderCheck(){document.getElementById('check').innerHTML=`${sec('CHECK')}<div class="check-list">${CHECKS.map((x,i)=>`<label class="check ${state['c'+i]?'done':''}"><input type="checkbox" ${state['c'+i]?'checked':''} onchange="state['c${i}']=this.checked;save();renderCheck()"><span>${x}</span></label>`).join('')}</div><div class="field" style="margin-top:10px"><label>NOTES</label><textarea placeholder="예약번호 · 살 것 · 확인할 것" oninput="state.freeNote=this.value;save()">${esc(state.freeNote||'')}</textarea></div>`}
function renderMaybe(){document.getElementById('maybe').innerHTML=`${sec('MAYBE')}<div class="maybe-list">${MAYBE.map((x,i)=>`<button class="maybe-card ${tone(i)}" onclick="location.hash='maybeDetail/${x.id}'"><b>${x.title}</b><small>${x.cn}</small><em>${x.when} · VIEW →</em></button>`).join('')}</div>`}
function renderWeather(){document.getElementById('weather').innerHTML=`${sec('WEATHER')}<div id="weatherList" class="weather-list"><div class="weather-card"><b>충칭</b><span>날씨 불러오는 중…</span></div></div><div class="action-grid" style="margin-top:9px"><button onclick="loadWeather()">REFRESH</button><a href="https://www.wlkst.com/" target="_blank">WULONG INFO ↗</a></div>`;loadWeather()}
async function loadWeather(){const box=document.getElementById('weatherList');try{const ps=[['충칭',29.563,106.551],['우롱',29.325,107.760]];const rows=[];for(const [n,lat,lon] of ps){const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=Asia%2FShanghai`);const j=await r.json();rows.push(`<div class="weather-card"><b>${n}</b><strong>${Math.round(j.current.temperature_2m)}°</strong><span>현재 기온</span></div>`)}box.innerHTML=rows.join('')}catch(e){box.innerHTML='<div class="weather-card"><b>날씨</b><span>네트워크 연결 후 다시 시도해주세요.</span></div>'}}
function renderEmergency(){document.getElementById('emergency').innerHTML=`${sec('EMERGENCY')}<div class="emergency-grid"><a href="tel:110"><span>POLICE</span><b>110</b></a><a href="tel:120"><span>AMBULANCE</span><b>120</b></a><a href="tel:119"><span>FIRE</span><b>119</b></a></div><div class="talk-list" style="margin-top:10px"><article class="talk pink"><div class="talk-ko">도와주세요.</div><div class="talk-zh">请帮帮我。</div><button onclick="copyText('请帮帮我。')">COPY</button></article><article class="talk mint"><div class="talk-ko">병원에 가야 해요.</div><div class="talk-zh">我需要去医院。</div><button onclick="copyText('我需要去医院。')">COPY</button></article></div>`}

function detailImage(type,id,alt){
  const q=encodeURIComponent(PHOTO_QUERY[id]||'chongqing,travel');
  const src=`https://loremflickr.com/960/720/${q}?lock=${PHOTO_LOCK[id]||499}`;
  const fallback=`https://picsum.photos/seed/cq-${encodeURIComponent(id)}/960/720`;
  return `<div class="detail-image"><img src="${src}" alt="${esc(alt)}" loading="eager" decoding="async" referrerpolicy="no-referrer" onerror="if(!this.dataset.fallback){this.dataset.fallback='1';this.src='${fallback}'}else{this.closest('.detail-image').style.display='none'}"></div>`
}
function renderFoodGuide(id){const g=FOOD_GUIDE[id];if(!g)return '';return `<section class="detail-section food-guide"><span>ORDER TIP</span><p class="food-guide-copy">${g.tip}</p><div class="food-phrase-list">${g.phrases.map(([zh,ko])=>`<button class="food-phrase" onclick="copyText('${zh}')"><span><b>${zh}</b><small>${ko}</small></span><i>＋</i></button>`).join('')}</div></section>`}
function openDetail(type,id,from){location.hash=`detail/${type}/${id}/${from}`}
function renderDetail(type,id,from){
  const isFood=type==='food'||type==='moreFood';
  const d=type==='food'?FOODS[id]:type==='moreFood'?MORE_FOODS[id]:type==='moreSpot'?MORE_SPOTS[id]:SPOTS[id];if(!d){go(from||'spots');return}
  const arr=isFood?d.order:d.highlights,links=mapLinks(d.search||d.cn),memoKey=`${type}:${id}`;
  document.getElementById('detail').innerHTML=`<main class="stack"><div class="detail-nav"><button class="back" onclick="go('${from||'spots'}')">← BACK</button><span>${isFood?'FOOD':'SPOT'}</span></div><section class="detail-head ${isFood?'pink':'mint'}"><span class="micro">${d.kind}</span><h1>${d.name}</h1><p>${d.cn}<br>${d.en||''}</p></section>${detailImage(type,id,d.name)}<div class="fact-grid"><div class="fact"><span>DATE</span><b>${d.date}</b></div><div class="fact"><span>${isFood?'TYPE':'AREA'}</span><b>${isFood?d.kind:d.area}</b></div><div class="fact"><span>STATUS</span><b>OPEN</b></div></div><section class="detail-section"><span>ABOUT</span><p class="body">${d.summary}</p></section><section class="detail-section ${isFood?'lav':'lime'}"><span>${isFood?'ORDER':'HIGHLIGHTS'}</span><div class="detail-list">${(arr||[]).map((x,i)=>`<div><i>${String(i+1).padStart(2,'0')}</i><b>${x}</b></div>`).join('')}</div></section>${isFood?renderFoodGuide(id):''}<section class="detail-section"><span>TOOLS</span><div class="tool-grid"><button onclick="copyText('${esc(d.cn)}')">COPY 中文</button><button onclick="copyText('${esc(d.search||d.cn)}')">COPY SEARCH</button><a href="${links.amap}" target="_blank">高德地图 ↗</a><a href="${links.google}" target="_blank">GOOGLE ↗</a></div></section><section class="detail-section"><span>MEMO</span><textarea class="memo-dark" placeholder="주소 · 주문 · 시간 등을 적어두세요." oninput="state.detailMemos['${memoKey}']=this.value;save()">${esc(state.detailMemos[memoKey]||'')}</textarea></section>${renderLinks('detail',memoKey)}</main>`;
}
function renderMaybeDetail(id){
  const d=MAYBE.find(x=>x.id===id);if(!d){go('maybe');return}const links=mapLinks(d.search||d.cn);
  document.getElementById('detail').innerHTML=`<main class="stack"><div class="detail-nav"><button class="back" onclick="go('maybe')">← MAYBE</button><span>${d.type}</span></div><section class="detail-head lav"><span class="micro">MAYBE</span><h1>${d.title}</h1><p>${d.cn}<br>${d.when}</p></section>${detailImage('maybe',id,d.title)}<section class="detail-section"><span>ABOUT</span><p class="body">${d.summary}</p></section><section class="detail-section mint"><span>HIGHLIGHTS</span><div class="detail-list">${d.highlights.map((x,i)=>`<div><i>${String(i+1).padStart(2,'0')}</i><b>${x}</b></div>`).join('')}</div></section><section class="detail-section"><span>TOOLS</span><div class="tool-grid"><button onclick="copyText('${esc(d.cn)}')">COPY 中文</button><a href="${links.amap}" target="_blank">高德地图 ↗</a><a href="${links.google}" target="_blank">GOOGLE ↗</a></div></section></main>`;
}
function renderFlight(code,from='book'){
  const f=FLIGHT_DETAILS[code];if(!f){go(from||'book');return}
  const back=from==='today'?'today':from==='plan'?'plan':'book';
  document.getElementById('detail').innerHTML=`<main class="stack flight-detail"><div class="detail-nav"><button class="back" onclick="go('${back}')">← ${back.toUpperCase()}</button><span>FLIGHT</span></div><section class="flight-head"><span>${f.date}</span><div class="flight-code">${f.code}</div><h1>${f.route}</h1></section><section class="flight-route"><div><span>DEPART</span><b>${f.depart}</b><small>${f.from}</small></div><i>→</i><div><span>ARRIVE</span><b>${f.arrive}</b><small>${f.to}</small></div></section><section class="flight-note"><span>NOTE</span><p>${f.note}</p></section></main>`;
}
function renderHotel(key){
  const h=HOTEL_DETAILS[key];if(!h){go('book');return}const links=mapLinks(h.address);
  document.getElementById('detail').innerHTML=`<main class="stack hotel-detail"><div class="detail-nav"><button class="back" onclick="go('book')">← BOOKINGS</button><span>HOTEL</span></div><section class="hotel-head"><span class="micro">${h.stay}</span><h1>${h.name}</h1><p>${h.enName}</p></section><section class="address-card"><span>ADDRESS</span><div class="cn-address">${h.address}</div><div class="en-address">${h.enAddress}</div></section><div class="grid2"><div class="card mint"><span class="micro">AREA</span><div class="body"><b>${h.area}</b></div></div><div class="card pink"><span class="micro">STAY</span><div class="body"><b>${h.stay}</b></div></div></div><div class="hotel-actions"><button onclick="copyText('${esc(h.address)}')">COPY ADDRESS</button><button onclick="copyText('${esc(h.name)}')">COPY HOTEL</button><a href="${links.amap}" target="_blank">高德地图 ↗</a><a href="${links.google}" target="_blank">GOOGLE ↗</a></div></main>`;
}
function route(){const p=(location.hash||'#today').slice(1).split('/');const v=p[0];if(v==='detail'){renderDetail(p[1],p[2],p[3]);show('detail');nav('detail');return}if(v==='hotel'){renderHotel(p[1]);show('detail');nav('detail');return}if(v==='flight'){renderFlight(p[1],p[2]||'book');show('detail');nav('detail');return}if(v==='maybeDetail'){renderMaybeDetail(p[1]);show('detail');nav('detail');return}const allowed=['today','plan','spots','eat','more','book','money','talk','check','maybe','weather','emergency','theme'];const id=allowed.includes(v)?v:'today';({today:renderToday,plan:renderPlan,spots:renderSpots,eat:renderEat,more:renderMore,book:renderBook,money:renderMoney,talk:renderTalk,check:renderCheck,maybe:renderMaybe,weather:renderWeather,emergency:renderEmergency,theme:renderTheme}[id])();show(id);nav(id)}
window.addEventListener('hashchange',route);if(!location.hash)history.replaceState(null,'','#today');route();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
