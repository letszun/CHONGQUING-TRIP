<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>Chongqing City</title>
<link rel="manifest" href="manifest.json">
<style>
:root{
  /* Reference palette: CHARCOAL / WARM GREEN / SAGE / GREY / LIME */
  --charcoal:#2E2D2D;
  --warm-green:#ACB77A;
  --sage:#D1E2BE;
  --grey:#F8F7F2;
  --lime:#E8F985;
  --bg:var(--grey);
  --paper:var(--grey);
  --ink:var(--charcoal);
  --muted:rgba(46,45,45,.62);
  --line:rgba(46,45,45,.10);
  /* Legacy color tokens remapped so the existing layout/logic stays untouched. */
  --red:var(--charcoal);
  --yellow:var(--lime);
  --blue:var(--warm-green);
  --lav:var(--sage);
  --pink:var(--lime);
  --mint:var(--sage);
  --sand:var(--grey);
  --black:var(--charcoal);
  --white:var(--grey);
  --shadow:0 14px 34px rgba(46,45,45,.10);
  --r-xl:34px;
  --r-lg:28px;
  --r-md:22px;
  --english:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--grey);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;letter-spacing:-.02em}
button,input,textarea,select{font:inherit}
button{border:0;background:none;cursor:pointer;color:inherit;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
a{text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
.app{width:min(100%,780px);margin:0 auto;min-height:100vh;padding:0 18px 120px}
.view{display:none}.view.active{display:block}
.page-top{padding:calc(22px + env(safe-area-inset-top)) 0 16px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.en-title,.big-en,.nav-label,.chip,.mini-title{font-family:var(--english)}
.hero-title{margin:8px 0 0;font-family:var(--english);font-size:clamp(42px,11vw,74px);line-height:.88;letter-spacing:-.07em;font-weight:900}
.hero-sub{margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--muted)}
.pills{display:flex;gap:8px;overflow:auto;padding:14px 0 2px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--white);padding:9px 12px;border-radius:999px;box-shadow:var(--shadow);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.banner{margin-top:16px;background:var(--black);color:var(--white);padding:22px;border-radius:34px;box-shadow:var(--shadow)}
.banner small{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(248,247,242,.70)}
.banner strong{display:block;font-family:var(--english);font-size:30px;line-height:.95;letter-spacing:-.05em;margin-top:10px}
.banner p{margin:10px 0 0;font-size:12px;line-height:1.55;color:rgba(255,255,255,.72)}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.section-top{padding:calc(22px + env(safe-area-inset-top)) 0 12px}
.section-title{margin:0;font-family:var(--english);font-size:clamp(38px,10vw,62px);line-height:.92;letter-spacing:-.06em;font-weight:900}
.section-sub{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.55}
.filters{display:flex;gap:8px;overflow:auto;padding:12px 0 6px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}
.filter{flex:none;background:var(--white);border-radius:999px;padding:10px 13px;box-shadow:var(--shadow);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.filter.active{background:var(--black);color:var(--white)}
.card{position:relative;border-radius:var(--r-xl);padding:18px;box-shadow:var(--shadow);overflow:hidden}
.color-red{background:var(--red);color:var(--grey)}.color-yellow{background:var(--yellow)}.color-blue{background:var(--blue)}.color-lav{background:var(--lav)}.color-pink{background:var(--pink)}.color-mint{background:var(--mint)}.color-sand{background:var(--sand)}.color-black{background:var(--black);color:var(--grey)}.color-white{background:var(--white)}
.day-card .head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.day-card .day-no{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.day-card .day-title{font-family:var(--english);font-size:clamp(28px,8vw,42px);line-height:.92;letter-spacing:-.05em;font-weight:900;margin-top:6px}
.day-card .day-place{font-size:11px;font-weight:700;opacity:.74;margin-top:8px}
.day-card .date-box{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.day-card .date-box b{font-size:18px;letter-spacing:-.04em}.day-card .date-box span{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(248,247,242,.68);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.color-red .date-box span,.color-black .date-box span{background:rgba(248,247,242,.18);color:var(--grey)}
.events{display:grid;gap:9px;margin-top:16px}

.color-red .event,.color-black .event{background:rgba(248,247,242,.12);color:var(--grey)}
.event .time{font-size:10px;font-weight:900;padding-top:2px}.event .title{font-size:14px;font-weight:800;line-height:1.24}.event .sub{font-size:10px;line-height:1.42;margin-top:4px;opacity:.72}.event.clickable .title:after{content:' ↗';font-size:10px;font-weight:900}
.tile{min-height:184px;text-align:left;border-radius:30px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .chip{display:inline-flex;padding:7px 10px;border-radius:999px;background:rgba(248,247,242,.72);font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}

.tile .meta{position:absolute;left:16px;bottom:16px;font-size:10px;font-weight:800;color:rgba(46,45,45,.78)}
.tile .go{position:absolute;right:14px;bottom:14px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(46,45,45,.96);color:var(--grey);font-size:18px;font-weight:900}
.today-hero{display:grid;gap:14px}

.today-card .big-title{font-family:var(--english);font-size:clamp(30px,9vw,48px);line-height:.92;letter-spacing:-.06em;font-weight:900;margin-top:8px}
.today-card .info{margin-top:12px;font-size:13px;line-height:1.55}
.quick-links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.quick-btn{padding:16px;border-radius:24px;text-align:left;box-shadow:var(--shadow);min-height:116px}
.quick-btn .mini-title{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.quick-btn strong{display:block;font-family:var(--english);font-size:23px;line-height:.95;letter-spacing:-.05em;margin-top:10px}
.quick-btn p{margin:8px 0 0;font-size:12px;line-height:1.48;color:var(--muted)}
.booking-list,.talk-list,.check-list,.maybe-list,.expense-list{display:grid;gap:12px;margin-top:14px}
.booking{padding:16px;border-radius:26px;box-shadow:var(--shadow)}
.booking .row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.booking .type{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.booking .title{font-family:var(--english);font-size:24px;line-height:.95;letter-spacing:-.05em;font-weight:900;margin-top:10px}
.booking .meta{font-size:12px;line-height:1.55;margin-top:10px}
.booking .code{margin-top:12px;display:inline-flex;padding:8px 10px;border-radius:999px;background:rgba(248,247,242,.72);font-size:10px;font-weight:800;letter-spacing:.06em}
.booking-memo{margin-top:12px;padding:12px 13px;border-radius:18px;background:rgba(248,247,242,.70)}
.booking-memo label{display:block;font-size:9px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:rgba(46,45,45,.74);margin-bottom:7px}
.booking-memo textarea{width:100%;min-height:76px;border:0;outline:0;resize:vertical;background:transparent;font-size:13px;line-height:1.55;color:var(--ink)}
.detail-memo{width:100%;min-height:100px;border:0;outline:0;resize:vertical;background:var(--grey);border-radius:18px;padding:13px 14px;font-size:13px;line-height:1.6;color:var(--ink)}
.map-note{margin-top:8px;font-size:11px;color:var(--muted);line-height:1.45}
.money-total{margin-top:16px;background:var(--black);color:var(--grey);padding:22px;border-radius:34px;box-shadow:var(--shadow)}
.money-total .tiny{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(248,247,242,.72)}
.money-total .num{font-family:var(--english);font-size:clamp(48px,14vw,86px);line-height:.9;font-weight:900;letter-spacing:-.09em;margin-top:12px}.money-total .num small{font-size:13px;letter-spacing:.04em}
.input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.input-card{padding:16px;border-radius:26px;box-shadow:var(--shadow)}
.input-card label{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(46,45,45,.78)}
.input-card input,.input-card select{width:100%;border:0;outline:0;background:transparent;font-family:var(--english);font-size:30px;font-weight:900;letter-spacing:-.05em;padding-top:8px;color:var(--ink)}
.input-card.select select{font-size:19px;font-family:inherit;font-weight:700;padding-top:14px}
.info-list{display:grid;gap:10px;margin-top:14px}.info-chip{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 16px;border-radius:22px;box-shadow:var(--shadow);font-size:12px;font-weight:800}.info-chip b{font-size:13px}
.note-card{margin-top:14px;background:var(--white);padding:16px;border-radius:26px;box-shadow:var(--shadow)}
.note-card label{display:block;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.note-card textarea{width:100%;min-height:108px;border:0;outline:0;resize:vertical;background:transparent;line-height:1.6}
.expense-item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 16px;border-radius:22px;box-shadow:var(--shadow)}
.expense-item .left b{display:block;font-size:15px;line-height:1.2}.expense-item .left span{display:block;font-size:11px;color:var(--muted);margin-top:4px}.expense-item .right{text-align:right}.expense-item .right strong{display:block;font-family:var(--english);font-size:18px}.expense-item .right button{margin-top:6px;font-size:10px;font-weight:800;color:var(--charcoal)}
.inline-btn{margin-top:12px;display:inline-flex;padding:10px 14px;border-radius:999px;background:var(--black);color:var(--grey);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.inline-btn.alt{background:var(--grey);color:var(--charcoal);box-shadow:var(--shadow)}
.talk-card{padding:16px;border-radius:28px;box-shadow:var(--shadow)}
.talk-card .ko{font-size:11px;line-height:1.48;font-weight:700;opacity:.78}.talk-card .zh{font-size:22px;line-height:1.06;font-weight:900;margin:10px 0 14px}
.task{display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:flex-start;padding:16px;border-radius:24px;box-shadow:var(--shadow);background:var(--white)}
.task input{appearance:none;width:21px;height:21px;border-radius:50%;border:2px solid var(--charcoal);margin:1px 0 0;background:var(--grey)}
.task input:checked{background:var(--red);border-color:var(--red);position:relative}.task input:checked:after{content:'✓';position:absolute;left:4px;top:-2px;color:var(--grey);font-size:14px;font-weight:900}
.task.done .txt{text-decoration:line-through;opacity:.42}.task .txt{font-size:13px;font-weight:800;line-height:1.45}
.maybe-card{padding:16px;border-radius:28px;box-shadow:var(--shadow)}
.maybe-card .type{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.72}.maybe-card .title{font-family:var(--english);font-size:24px;line-height:.95;letter-spacing:-.05em;font-weight:900;margin-top:10px}.maybe-card .sub{font-size:12px;line-height:1.55;margin-top:8px}
.detail-top{padding:calc(20px + env(safe-area-inset-top)) 0 16px}.back{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:var(--grey);box-shadow:var(--shadow);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.detail-card{margin-top:14px;padding:20px;border-radius:34px;box-shadow:var(--shadow)}
.detail-card .type{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.detail-card .name{font-family:var(--english);font-size:clamp(38px,10vw,66px);line-height:.9;letter-spacing:-.06em;font-weight:900;margin-top:10px}
.detail-card .cn{font-size:17px;font-weight:700;opacity:.75;margin-top:7px}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.detail-tags span{display:inline-flex;padding:8px 10px;border-radius:999px;background:rgba(248,247,242,.72);font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.photo-shell{margin-top:16px;display:grid;gap:10px}
.photo-frame{width:min(100%,460px);aspect-ratio:1.16/1;margin:0 auto;background:rgba(255,255,255,.42);box-shadow:0 16px 28px rgba(0,0,0,.08);overflow:hidden}
.photo-frame img{width:100%;height:100%;object-fit:cover}
.photo-frame.fallback{display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(17,17,17,.1));color:rgba(17,17,17,.42);font-family:var(--english);font-size:14px;font-weight:900;letter-spacing:.16em}

.detail-caption{text-align:center;font-size:10px;font-weight:800;opacity:.64}
.detail-section{margin-top:12px;background:var(--white);border-radius:26px;padding:18px;box-shadow:var(--shadow)}

/* v9 UX overrides */
body{font-size:16px}
.section-title{font-family:var(--english);font-size:clamp(36px,10vw,56px);font-weight:900;letter-spacing:-.06em;line-height:.94}
.section-top.compact{padding-top:8px}
.secondary-back{padding:calc(18px + env(safe-area-inset-top)) 0 0}.secondary-back button{min-height:44px;padding:0 14px;border-radius:999px;background:var(--grey);box-shadow:var(--shadow);font-size:13px;font-weight:800}

.nav-btn{min-width:0;width:100%;min-height:52px;padding:7px 2px}.nav-btn i{font-size:17px}.nav-btn .nav-label{font-family:var(--english);font-size:9px;letter-spacing:.05em;text-transform:uppercase;font-weight:800}
.readable-list{display:grid;gap:10px;margin-top:14px}

/* v17 — CHARCOAL foreground contrast rules
   Any component using the charcoal token (legacy .color-red / .color-black)
   must use light text throughout. */
.catalog-card.color-red,
.catalog-card.color-black{
  color:var(--grey);
}
.catalog-card.color-red .catalog-name,
.catalog-card.color-black .catalog-name,
.catalog-card.color-red .catalog-cn,
.catalog-card.color-black .catalog-cn,
.catalog-card.color-red .catalog-en,
.catalog-card.color-black .catalog-en,
.catalog-card.color-red .catalog-meta,
.catalog-card.color-black .catalog-meta{
  color:var(--grey);
}
.catalog-card.color-red .catalog-chip,
.catalog-card.color-black .catalog-chip{
  background:rgba(248,247,242,.16);
  color:var(--grey);
}
.catalog-card.color-red .catalog-arrow,
.catalog-card.color-black .catalog-arrow{
  background:var(--grey);
  color:var(--charcoal);
}

.more-card.color-red,
.more-card.color-black{
  color:var(--grey);
}
.more-card.color-red .more-title,
.more-card.color-black .more-title,
.more-card.color-red .more-sub,
.more-card.color-black .more-sub{
  color:var(--grey);
}
.more-card.color-red .more-sub,
.more-card.color-black .more-sub{
  opacity:.78;
}
.more-card.color-red .more-arrow,
.more-card.color-black .more-arrow{
  background:var(--grey);
  color:var(--charcoal);
}

/* Keep the same contrast behavior if charcoal cards are reused in other lists. */
.booking.color-red,
.booking.color-black,
.maybe-card.color-red,
.maybe-card.color-black,
.quick-btn.color-red,
.quick-btn.color-black{
  color:var(--grey);
}
.booking.color-red .type,
.booking.color-red .title,
.booking.color-red .meta,
.booking.color-black .type,
.booking.color-black .title,
.booking.color-black .meta,
.maybe-card.color-red .type,
.maybe-card.color-red .title,
.maybe-card.color-red .sub,
.maybe-card.color-black .type,
.maybe-card.color-black .title,
.maybe-card.color-black .sub{
  color:var(--grey);
}


/* v20 — iOS Safari / standalone PWA text color hardening for TODAY + PLAN.
   WebKit can apply its control text fill color inside clickable buttons even when
   the parent button inherits the intended CSS color. Force text-fill to follow
   each element's resolved currentColor without changing the visual hierarchy. */
#today button,
#today button *,
#plan button,
#plan button *{
  -webkit-text-fill-color:currentColor !important;
}

/* Explicit base colors for the clickable components used on these two screens. */
#today .quick-btn{
  color:var(--charcoal) !important;
}
#today .quick-btn .mini-title,
#today .quick-btn p{
  color:var(--muted) !important;
}
#today .action-btn.light{
  color:var(--charcoal) !important;
}
#today .action-btn{
  -webkit-text-fill-color:currentColor !important;
}

#plan .day-card:not(.color-red):not(.color-black) .event.clickable{
  color:var(--charcoal) !important;
}
#plan .day-card.color-red .event.clickable,
#plan .day-card.color-black .event.clickable{
  color:var(--grey) !important;
}
#plan .event.clickable .time,
#plan .event.clickable .title,
#plan .event.clickable .sub{
  color:inherit !important;
  -webkit-text-fill-color:currentColor !important;
}

.snap-card,.pass-sheet{position:relative;flex:0 0 min(86vw,520px);scroll-snap-align:start;scroll-snap-stop:normal;border:1px solid rgba(31,31,27,.08);box-shadow:var(--shadow);color:var(--ink);overflow:hidden}

.tone-paper{background:var(--paper)!important;color:var(--ink)!important}.tone-warm{background:var(--warm)!important;color:var(--ink)!important}.tone-lemon{background:var(--lemon)!important;color:var(--ink)!important}
.snap-card-top,.snap-foot,.pass-head,.pass-bottom,.index-top,.index-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}
.snap-card-top{font-family:var(--english);font-size:10px;font-weight:800;letter-spacing:.14em}

.snap-title{margin-top:12px;font-size:28px;line-height:1;font-weight:850;letter-spacing:-.045em}
.snap-sub{margin-top:12px;font-size:13px;line-height:1.55;max-width:30ch;color:rgba(31,31,27,.78)}
.snap-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.rail-pill{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(31,31,27,.14);background:rgba(255,255,255,.35);font-size:10px;font-weight:850;letter-spacing:.08em;color:var(--ink)}
.rail-pill.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.snap-foot{margin-top:auto;padding-top:20px;border-top:1px dashed rgba(31,31,27,.24);font-size:10px;font-weight:750;letter-spacing:.05em}
.snap-footer{display:flex;justify-content:space-between;align-items:center;padding:0 2px 8px}
.snap-dots{display:flex;align-items:center;gap:6px}.snap-dot{width:8px;height:8px;border-radius:999px;background:rgba(31,31,27,.18);padding:0}.snap-dot.active{width:26px;background:var(--ink)}
.swipe-label{font-family:var(--english);font-size:9px;letter-spacing:.16em;color:var(--muted)}
.utility-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.utility-strip button{min-height:72px;border-radius:20px;background:var(--paper);border:1px solid rgba(31,31,27,.08);padding:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);box-shadow:var(--shadow)}
.utility-strip b{font-family:var(--english);font-size:9px;letter-spacing:.14em;color:var(--muted)}.utility-strip span{font-family:var(--english);font-size:13px;font-weight:900;letter-spacing:-.03em}

/* plan cards: no absolute positioning, no pointer capture */
.plan-rail{padding-bottom:22px;align-items:flex-start}
.pass-sheet{flex-basis:min(88vw,540px);border-radius:30px;padding:18px;min-height:0}
.pass-eyebrow{font-family:var(--english);font-size:10px;letter-spacing:.14em;font-weight:800}.pass-date{font-family:var(--english);font-size:46px;line-height:.9;letter-spacing:-.07em;font-weight:900;margin-top:8px}.pass-day{font-family:var(--english);font-size:12px;font-weight:850;letter-spacing:.12em}
.pass-route{margin-top:18px;font-size:27px;font-weight:850;letter-spacing:-.05em;line-height:1}.pass-meta{display:grid;gap:4px;margin-top:10px;font-size:11px;color:rgba(31,31,27,.70)}
.pass-perf{border-top:1px dashed rgba(31,31,27,.28);margin:18px -18px 14px;position:relative}.pass-perf:before,.pass-perf:after{content:'';position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg)}.pass-perf:before{left:-9px}.pass-perf:after{right:-9px}
.pass-events{display:grid;gap:8px}.pass-event{display:grid;grid-template-columns:52px 1fr 18px;gap:9px;align-items:start;width:100%;padding:10px 10px;border-radius:16px;background:rgba(255,255,255,.35);border:1px solid rgba(31,31,27,.07);text-align:left;color:var(--ink)}.pass-event.static{opacity:.82}.pass-time{font-family:var(--english);font-size:10px;font-weight:850;padding-top:2px}.pass-event b{display:block;font-size:13px;line-height:1.25}.pass-event small{display:block;margin-top:3px;font-size:10px;line-height:1.35;color:rgba(31,31,27,.62)}.pass-event i{font-style:normal;font-size:12px}.pass-bottom{margin-top:14px;padding-top:12px;border-top:1px solid rgba(31,31,27,.12);font-size:10px;font-weight:800;letter-spacing:.05em}

.light-filters{margin:0 0 8px;padding:6px 0}.filter{background:var(--paper);color:var(--ink);border:1px solid rgba(31,31,27,.08);box-shadow:none}.filter.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.index-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}.index-card{aspect-ratio:1/1;border-radius:26px;padding:14px;text-align:left;display:flex;flex-direction:column;color:var(--ink);border:1px solid rgba(31,31,27,.08);box-shadow:var(--shadow)}.index-top{font-family:var(--english);font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}.index-name{margin-top:28px;font-size:clamp(20px,5.4vw,26px);font-weight:850;line-height:1.04;letter-spacing:-.045em;word-break:keep-all}.index-en{margin-top:8px;font-size:10px;line-height:1.4;color:rgba(31,31,27,.62)}.index-bottom{margin-top:auto;padding-top:10px;border-top:1px solid rgba(31,31,27,.13);font-size:9px;font-weight:800;letter-spacing:.04em}
.tool-list{display:grid;gap:8px;margin-top:10px}.tool-row{min-height:88px;border-radius:22px;background:var(--paper);border:1px solid rgba(31,31,27,.08);display:grid;grid-template-columns:36px 1fr 28px;gap:8px;align-items:center;padding:12px 14px;color:var(--ink);box-shadow:var(--shadow);text-align:left}.tool-row.lemon{background:var(--lemon)}.tool-num{font-family:var(--english);font-size:10px;font-weight:800;letter-spacing:.12em}.tool-main b{display:block;font-family:var(--english);font-size:25px;letter-spacing:-.05em}.tool-main small{display:block;margin-top:4px;font-size:11px;color:rgba(31,31,27,.62)}.tool-arrow{font-size:20px;font-weight:900}

/* every old color token is now light + dark text */
.color-red,.color-lav,.color-sand{background:var(--lemon)!important;color:var(--ink)!important}.color-blue,.color-pink,.color-black{background:var(--warm)!important;color:var(--ink)!important}.color-yellow,.color-mint,.color-white{background:var(--paper)!important;color:var(--ink)!important}
.color-red *, .color-lav *, .color-sand *, .color-blue *, .color-pink *, .color-black *, .color-yellow *, .color-mint *, .color-white *{-webkit-text-fill-color:currentColor!important}

/* secondary pages: eliminate white-on-white */
.secondary-back button,.back{background:var(--paper)!important;color:var(--ink)!important;border:1px solid rgba(31,31,27,.10)!important;box-shadow:none!important}
.booking,.input-card,.info-chip,.note-card,.expense-item,.talk-card,.task,.maybe-card,.weather-card,.status-card,.notice-card,.emergency-card,.detail-section{background:var(--paper)!important;color:var(--ink)!important;border:1px solid rgba(31,31,27,.08)!important;box-shadow:var(--shadow)!important}
.booking *,.input-card *,.info-chip *,.note-card *,.expense-item *,.talk-card *,.task *,.maybe-card *,.weather-card *,.status-card *,.notice-card *,.emergency-card *,.detail-section *{color:inherit!important;-webkit-text-fill-color:currentColor!important}
.booking-memo,.detail-memo{background:rgba(31,31,27,.045)!important;color:var(--ink)!important}.booking-memo label,.input-card label,.note-card label{color:var(--muted)!important}.booking-memo textarea,.input-card input,.input-card select,.note-card textarea,.detail-memo{color:var(--ink)!important}.booking-memo textarea::placeholder,.input-card input::placeholder,.note-card textarea::placeholder,.detail-memo::placeholder{color:rgba(31,31,27,.42)!important}
.money-total{background:var(--lemon)!important;color:var(--ink)!important}.money-total *{color:inherit!important}.inline-btn,.action-btn{background:var(--ink)!important;color:var(--paper)!important;border:0!important}.action-btn.light{background:var(--paper)!important;color:var(--ink)!important;border:1px solid rgba(31,31,27,.10)!important}

/* detail boarding pass — rectangular image, no masks */
.detail-page-light{display:grid;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 94px;color:var(--ink)}.detail-back button{min-height:40px;padding:0 14px;border-radius:999px;background:var(--paper);color:var(--ink);border:1px solid rgba(31,31,27,.10);font-size:11px;font-weight:800;letter-spacing:.08em}
.boarding-ticket{position:relative;background:var(--lemon);border:1px solid rgba(31,31,27,.10);border-radius:32px;padding:18px;overflow:hidden;box-shadow:var(--shadow);color:var(--ink)}.boarding-ticket:before,.boarding-ticket:after{content:'';position:absolute;top:65%;width:22px;height:22px;border-radius:50%;background:var(--bg);transform:translateY(-50%)}.boarding-ticket:before{left:-11px}.boarding-ticket:after{right:-11px}.bt-top{display:flex;justify-content:space-between;gap:12px;font-family:var(--english);font-size:10px;font-weight:800;letter-spacing:.14em}.bt-title{margin-top:18px;font-size:34px;line-height:.95;font-weight:850;letter-spacing:-.055em}.bt-cn{margin-top:8px;font-size:14px;font-weight:700}.bt-en{margin-top:3px;font-family:var(--english);font-size:14px;color:rgba(31,31,27,.60)}.bt-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.bt-meta span{display:inline-flex;padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.38);border:1px solid rgba(31,31,27,.08);font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.detail-image-frame{width:100%;aspect-ratio:16/9;margin-top:16px;border-radius:20px;overflow:hidden;background:var(--warm-2);-webkit-mask-image:none!important;mask-image:none!important}.detail-image-frame img{width:100%;height:100%;object-fit:cover}.detail-image-frame.fallback{display:grid;place-items:center;font-family:var(--english);font-size:24px;font-weight:900;letter-spacing:.12em;color:rgba(31,31,27,.35)}
.bt-perf{margin:18px -18px 14px;border-top:1px dashed rgba(31,31,27,.30)}.bt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.bt-grid>div{min-height:64px;padding:10px;border-radius:15px;background:rgba(255,255,255,.30);border:1px solid rgba(31,31,27,.07)}.bt-grid span{display:block;font-family:var(--english);font-size:8px;font-weight:800;letter-spacing:.12em;color:rgba(31,31,27,.55)}.bt-grid b{display:block;margin-top:6px;font-size:11px;line-height:1.35;word-break:break-word}.bt-status{width:100%;min-height:44px;margin-top:12px;border-radius:15px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:850;letter-spacing:.08em}
.stub-panel{background:var(--paper);border:1px solid rgba(31,31,27,.08);border-radius:24px;padding:15px;color:var(--ink);box-shadow:var(--shadow)}.stub-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-bottom:11px;border-bottom:1px solid rgba(31,31,27,.11);font-family:var(--english);font-size:10px;font-weight:800;letter-spacing:.13em}.stub-panel p{margin:12px 0 0;font-size:14px;line-height:1.62;color:var(--ink)!important}.stub-panel ul{margin:12px 0 0;padding-left:18px;display:grid;gap:7px}.stub-panel li{font-size:14px;line-height:1.5;color:var(--ink)!important}.stub-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.stub-actions button,.stub-actions a{min-height:46px;border-radius:14px;background:var(--warm);border:1px solid rgba(31,31,27,.08);display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:11px;font-weight:800;color:var(--ink)!important}.light-memo{width:100%;min-height:130px;margin-top:12px;border-radius:15px;border:1px solid rgba(31,31,27,.10);background:#ECE9E1;color:var(--ink);padding:12px;font-size:13px;line-height:1.6}.light-memo::placeholder{color:rgba(31,31,27,.40)}

/* splash matches light theme */
.splash-screen{background:linear-gradient(180deg,#F3F1EB 0%,#E6E2D8 100%)!important}.splash-noise{opacity:.025}.splash-back{background:var(--warm)!important}.splash-mid{background:var(--lemon)!important}.splash-front{background:var(--paper)!important;border:1px solid rgba(31,31,27,.08)!important;color:var(--ink)!important}.splash-kicker,.splash-brand,.splash-city,.splash-chip{color:var(--ink)!important}.splash-city{color:#889300!important}.splash-chip{background:var(--warm)!important;border-color:rgba(31,31,27,.08)!important}.splash-barcode{background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 5px,var(--ink) 5px 7px,transparent 7px 9px)!important}

@media (max-width:560px){.snap-card{flex-basis:88vw}.pass-sheet{flex-basis:90vw}.utility-strip{gap:6px}.utility-strip button{min-height:66px;padding:9px}.index-grid{gap:10px}.index-card{border-radius:23px}.stub-actions{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}.snap-rail{scroll-snap-type:x proximity}}


/* v25 — reference palette + editorial serif titles + swipe-first PLAN */
:root{
  --ref-cream:#F0EEEB;
  --ref-sage:#BAC5BB;
  --ref-brown:#431705;
  --ref-coral:#F73D37;
  --bg:var(--ref-cream);
  --paper:var(--ref-cream);
  --warm:var(--ref-sage);
  --lemon:var(--ref-coral);
  --ink:var(--ref-brown);
  --charcoal:var(--ref-brown);
  --grey:var(--ref-cream);
  --blue:var(--ref-coral);
  --blue-2:var(--ref-brown);
  --muted:rgba(67,23,5,.58);
  --line:rgba(67,23,5,.14);
  --display-serif:"Iowan Old Style","Palatino Linotype","Book Antiqua","Noto Serif KR","AppleMyungjo",Georgia,serif;
  --body-sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
  --shadow:0 10px 24px rgba(67,23,5,.08),0 1px 0 rgba(255,255,255,.45) inset;
}
html{background:var(--ref-cream)!important}
body{background:var(--ref-cream)!important;color:var(--ref-brown)!important;font-family:var(--body-sans)!important;font-weight:450}
.app{color:var(--ref-brown)!important}

/* display typography */
.minimal-title,.hero-title,.section-title,.snap-big,.snap-title,.pass-date,.pass-route,.index-name,.bt-title,.booking .title,.maybe-card .title,.money-total .num,.weather-temp{
  font-family:var(--display-serif)!important;
  font-weight:700!important;
  letter-spacing:-.045em!important;
}
.minimal-title{font-size:clamp(48px,13vw,80px)!important;line-height:.86!important}
.pass-date{font-size:48px!important;line-height:.9!important}
.pass-route{font-size:29px!important;line-height:1.02!important}
.index-name{font-size:clamp(21px,5.6vw,28px)!important;line-height:1.05!important}
.bt-title{font-size:clamp(36px,9vw,54px)!important;line-height:.95!important}
.micro-label,.pass-eyebrow,.pass-day,.pass-time,.index-top,.index-en,.index-bottom,.tool-num,.tool-main small,.snap-foot,.booking .type,.booking .code,.stub-head,.bt-top,.bt-meta,.bt-grid,.nav-label,.filter,.rail-pill,.plan-swipe-top,.plan-scroll-controls{font-family:var(--body-sans)!important;font-weight:600!important}

/* exact palette */
.tone-paper{background:var(--ref-cream)!important;color:var(--ref-brown)!important}
.tone-warm{background:var(--ref-sage)!important;color:var(--ref-brown)!important}
.tone-lemon{background:var(--ref-coral)!important;color:var(--ref-cream)!important}
.tone-lemon *{color:inherit!important;-webkit-text-fill-color:currentColor!important}
.tone-lemon .pass-event,.tone-lemon .rail-pill{background:rgba(240,238,235,.14)!important;border-color:rgba(240,238,235,.22)!important;color:var(--ref-cream)!important}
.tone-lemon .pass-event small,.tone-lemon .pass-meta{color:rgba(240,238,235,.76)!important}
.tone-lemon .pass-perf,.tone-lemon .pass-bottom{border-color:rgba(240,238,235,.28)!important}
.tone-paper .pass-event,.tone-warm .pass-event{background:rgba(240,238,235,.46)!important;border-color:rgba(67,23,5,.08)!important;color:var(--ref-brown)!important}
.tone-paper .pass-event small,.tone-warm .pass-event small,.tone-paper .pass-meta,.tone-warm .pass-meta{color:rgba(67,23,5,.62)!important}

/* legacy colored surfaces constrained to four-color system */
.color-red,.color-lav{background:var(--ref-coral)!important;color:var(--ref-cream)!important}
.color-blue,.color-pink,.color-black{background:var(--ref-sage)!important;color:var(--ref-brown)!important}
.color-yellow,.color-mint,.color-white,.color-sand{background:var(--ref-cream)!important;color:var(--ref-brown)!important}
.color-red *,.color-lav *{color:inherit!important;-webkit-text-fill-color:currentColor!important}
.color-blue *,.color-pink *,.color-black *,.color-yellow *,.color-mint *,.color-white *,.color-sand *{color:inherit!important;-webkit-text-fill-color:currentColor!important}

/* NAV */
.bottom-nav{background:rgba(67,23,5,.96)!important;box-shadow:0 14px 34px rgba(67,23,5,.18)!important}
.nav-btn{color:rgba(240,238,235,.62)!important}
.nav-btn.active{background:var(--ref-coral)!important;color:var(--ref-cream)!important}

/* PLAN: horizontal swipe is primary */
.plan-head{padding-bottom:4px}
.plan-snap{margin-top:0;overflow:visible}
.plan-swipe-top{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;color:var(--ref-brown);font-size:10px;letter-spacing:.13em}
.plan-swipe-word{display:inline-flex;align-items:center;gap:8px}.plan-swipe-word:after{content:'→';font-size:16px;color:var(--ref-coral)}
.plan-rail{gap:12px!important;padding:8px 38px 18px 2px!important;scroll-snap-type:x mandatory!important;scroll-padding-left:2px!important;touch-action:pan-x pan-y!important;overscroll-behavior-inline:contain!important;cursor:grab}
.plan-rail.is-dragging{cursor:grabbing;scroll-snap-type:none!important;user-select:none}
.plan-rail .pass-sheet{flex:0 0 min(82vw,520px)!important;scroll-snap-align:start!important;scroll-snap-stop:normal!important}
.plan-scroll-track{height:3px;background:rgba(67,23,5,.12);border-radius:999px;overflow:hidden;margin:0 4px 10px}
.snap-progress-fill{display:block;width:20%;height:100%;background:var(--ref-coral);border-radius:inherit;transition:width .18s ease}
.plan-scroll-controls{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px;padding:0 2px;color:rgba(67,23,5,.58);font-size:9px;letter-spacing:.14em;text-align:center}
.plan-scroll-btn{width:42px;height:42px;border-radius:999px;background:var(--ref-brown);color:var(--ref-cream)!important;font-size:17px;display:grid;place-items:center}
.plan-scroll-btn:disabled{opacity:.24}

/* filters & controls */
.filter{background:var(--ref-cream)!important;color:var(--ref-brown)!important;border-color:rgba(67,23,5,.12)!important}
.filter.active{background:var(--ref-brown)!important;color:var(--ref-cream)!important}
.rail-pill.dark,.inline-btn,.action-btn{background:var(--ref-brown)!important;color:var(--ref-cream)!important}
.rail-pill:not(.dark),.action-btn.light{background:var(--ref-cream)!important;color:var(--ref-brown)!important;border-color:rgba(67,23,5,.14)!important}

/* indexes */
.index-card{border-color:rgba(67,23,5,.10)!important}
.index-card.tone-lemon .index-en,.index-card.tone-lemon .index-bottom{color:rgba(240,238,235,.78)!important}
.index-card.tone-warm .index-en,.index-card.tone-warm .index-bottom,.index-card.tone-paper .index-en,.index-card.tone-paper .index-bottom{color:rgba(67,23,5,.62)!important}

/* secondary pages / contrast */
.secondary-back button,.back,.booking,.input-card,.info-chip,.note-card,.expense-item,.talk-card,.task,.maybe-card,.weather-card,.status-card,.notice-card,.emergency-card,.detail-section,.stub-panel{background:var(--ref-cream)!important;color:var(--ref-brown)!important;border-color:rgba(67,23,5,.10)!important}
.booking *,.input-card *,.info-chip *,.note-card *,.expense-item *,.talk-card *,.task *,.maybe-card *,.weather-card *,.status-card *,.notice-card *,.emergency-card *,.detail-section *,.stub-panel *{color:inherit!important;-webkit-text-fill-color:currentColor!important}
.money-total{background:var(--ref-coral)!important;color:var(--ref-cream)!important}
.money-total *{color:inherit!important;-webkit-text-fill-color:currentColor!important}

/* detailed ticket: deep-brown main pass + cream/sage stubs */
.detail-page-light{color:var(--ref-brown)!important}
.boarding-ticket{background:var(--ref-brown)!important;color:var(--ref-cream)!important;border-color:rgba(67,23,5,.12)!important}
.boarding-ticket *{color:inherit!important;-webkit-text-fill-color:currentColor!important}
.boarding-ticket .detail-image-frame{background:var(--ref-cream)!important;border-color:rgba(240,238,235,.16)!important}
.boarding-ticket .bt-meta span,.boarding-ticket .bt-grid>div,.boarding-ticket .bt-status{background:rgba(240,238,235,.10)!important;border-color:rgba(240,238,235,.16)!important;color:var(--ref-cream)!important}
.boarding-ticket .bt-status{background:var(--ref-coral)!important;border-color:var(--ref-coral)!important}
.stub-panel:nth-of-type(even){background:var(--ref-sage)!important}
.stub-panel::before{background:var(--ref-coral)!important}
.stub-actions button,.stub-actions a{background:var(--ref-brown)!important;color:var(--ref-cream)!important;border:0!important}
.light-memo{background:rgba(67,23,5,.05)!important;color:var(--ref-brown)!important;border-color:rgba(67,23,5,.10)!important}
.light-memo::placeholder{color:rgba(67,23,5,.42)!important}

/* splash */
.splash-screen{background:var(--ref-cream)!important}
.splash-back{background:var(--ref-sage)!important}
.splash-mid{background:var(--ref-coral)!important}
.splash-front{background:var(--ref-brown)!important;color:var(--ref-cream)!important;border-color:rgba(67,23,5,.10)!important}
.splash-kicker,.splash-brand,.splash-chip{color:var(--ref-cream)!important}
.splash-brand{font-family:var(--display-serif)!important;font-weight:700!important}
.splash-city{color:var(--ref-coral)!important}
.splash-chip{background:rgba(240,238,235,.10)!important;border-color:rgba(240,238,235,.15)!important}

/* v26 — flat green editorial system */
:root{

  --v26-ink:#403A35;
  --v26-soft:#746D66;
  --v26-red:#C95A4D;
  --bg:var(--v26-cream);

  --blue-2:var(--v26-ink);

/* v27 — unified editorial grid / green dominant + red signal */
:root{
  --ds-bg:#F0EEEB;
  --ds-green:#BAC5BB;
  --ds-green-soft:rgba(186,197,187,.34);
  --ds-green-faint:rgba(186,197,187,.18);
  --ds-brown:#431705;
  --ds-red:#F73D37;
  --ds-line:rgba(67,23,5,.22);
  --ds-muted:rgba(67,23,5,.58);
  --ds-x:18px;
  --ds-gap:12px;
  --ds-unit:8px;
  --bg:var(--ds-bg);--paper:var(--ds-bg);--ink:var(--ds-brown);--charcoal:var(--ds-brown);
  --warm:var(--ds-green);--blue:var(--ds-green);--blue-2:var(--ds-red);--muted:var(--ds-muted);--line:var(--ds-line);
}
html,body{background:var(--ds-bg)!important;color:var(--ds-brown)!important}
body{font-weight:400!important}
.app{width:min(100%,760px)!important;padding-left:var(--ds-x)!important;padding-right:var(--ds-x)!important}

/* one grid language everywhere */
.system-head{
  display:grid;grid-template-columns:42px minmax(0,1fr) 72px;gap:var(--ds-gap);align-items:end;
  padding:calc(22px + env(safe-area-inset-top)) 0 12px;border-bottom:1px solid var(--ds-line)
}
.system-head-no{font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--ds-red);padding-bottom:7px}
.system-head-main{min-width:0}.system-head-main .minimal-title{margin-top:4px!important}
.system-head-meta{font-size:9px;line-height:1.35;text-align:right;letter-spacing:.10em;color:var(--ds-muted);padding-bottom:7px}
.page-minimal-head{display:grid;grid-template-columns:42px minmax(0,1fr) 72px;gap:var(--ds-gap);align-items:end}
.page-minimal-head>.micro-label,.page-minimal-head>.minimal-title,.page-minimal-head>.head-rule{grid-column:2/-1}
.minimal-title{color:var(--ds-brown)!important;font-weight:600!important;letter-spacing:-.05em!important}
.micro-label,.kicker{color:var(--ds-muted)!important;letter-spacing:.12em!important}
.head-rule{background:var(--ds-brown)!important;opacity:.26!important}

/* green is the field, red is the signal */
#today .snap-rail,.plan-rail{background:var(--ds-green)!important}
#today .snap-card,.plan-rail .pass-sheet{border-color:rgba(67,23,5,.17)!important}
.snap-progress-fill{background:var(--ds-red)!important}
.plan-swipe-word::after{color:var(--ds-red)!important}
.plan-scroll-btn{border-color:rgba(67,23,5,.32)!important}
.plan-scroll-btn:not(:disabled):active{background:var(--ds-red)!important;color:var(--ds-bg)!important}
.snap-dot.active{background:var(--ds-red)!important}

/* bottom nav uses green, active is red micro-signal */
.bottom-nav{background:rgba(186,197,187,.97)!important;border-top:1px solid rgba(67,23,5,.16)!important}
.nav-btn{color:rgba(67,23,5,.48)!important}.nav-btn.active{color:var(--ds-brown)!important}
.nav-btn.active::after{background:var(--ds-red)!important;height:3px!important;left:28%!important;right:28%!important}

/* filters use alignment, not pills */
.editorial-filters{display:grid!important;grid-template-columns:42px repeat(3,max-content) 1fr;gap:var(--ds-gap)!important;align-items:end;margin:0!important;padding:10px 0 8px!important;border-bottom:1px solid var(--ds-line)!important}
.editorial-filters .filter:first-child{grid-column:2}
.filter{font-weight:500!important;letter-spacing:.08em!important;padding:4px 0!important;color:var(--ds-muted)!important}
.filter.active{color:var(--ds-brown)!important;border-bottom:2px solid var(--ds-red)!important}

/* SPOTS/EAT — items without cards */
.line-index-list{display:none!important}
.editorial-index-list{position:relative;border-bottom:1px solid var(--ds-line)}
.editorial-index-list::before{content:'';position:absolute;left:54px;top:0;bottom:0;width:1px;background:rgba(67,23,5,.18);pointer-events:none}
.editorial-index-row{
  position:relative;width:100%;display:grid;grid-template-columns:42px 1px minmax(0,1fr) 58px 20px;gap:var(--ds-gap);
  align-items:center;text-align:left;padding:16px 0;border:0;border-top:1px solid var(--ds-line);background:transparent!important;color:var(--ds-brown)!important
}
.editorial-index-row:first-child{border-top:0}
.editorial-index-row:nth-child(odd){background:var(--ds-green-faint)!important}
.editorial-index-row:active{background:var(--ds-green-soft)!important}
.editorial-index-no{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--ds-red);align-self:start;padding-top:2px}
.editorial-index-marker{width:7px;height:7px;border-radius:50%;background:var(--ds-green);box-shadow:0 0 0 3px var(--ds-bg);z-index:2;justify-self:center}
.editorial-index-row.is-done .editorial-index-marker{background:var(--ds-red)}
.editorial-index-main{min-width:0;display:block}
.editorial-index-main small{display:block;font-size:9px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ds-muted);margin-bottom:6px}
.editorial-index-main b{display:block;font-size:19px;line-height:1.1;font-weight:550;letter-spacing:-.028em;word-break:keep-all}
.editorial-index-main em{display:block;margin-top:5px;font-style:normal;font-size:11px;line-height:1.3;color:var(--ds-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editorial-index-date{font-size:9px;line-height:1.45;text-align:right;letter-spacing:.06em;color:var(--ds-muted)}
.editorial-index-arrow{font-size:17px;font-weight:400;color:var(--ds-red);text-align:right}
.editorial-index-row.is-done{opacity:.62}
.food-editorial-list .editorial-index-marker{background:var(--ds-green)}

/* MORE follows same columns */
.tool-list{display:none!important}.system-tool-list{border-bottom:1px solid var(--ds-line)}
.system-tool-row{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) 58px 20px;gap:var(--ds-gap);align-items:center;text-align:left;padding:15px 0;border:0;border-top:1px solid var(--ds-line);background:transparent!important;color:var(--ds-brown)!important}
.system-tool-row:nth-child(odd){background:var(--ds-green-faint)!important}
.system-tool-no{font-size:10px;font-weight:600;color:var(--ds-red);letter-spacing:.10em}
.system-tool-main b{display:block;font-size:18px;font-weight:550;letter-spacing:-.025em}.system-tool-main small{display:block;margin-top:5px;font-size:11px;color:var(--ds-muted)}
.system-tool-state{font-size:9px;text-align:right;letter-spacing:.08em;color:var(--ds-muted)}.system-tool-arrow{color:var(--ds-red);font-size:17px;text-align:right}

/* secondary list screens align to the same invisible columns */
.booking,.talk-card,.task,.maybe-card,.expense-item,.info-chip,.weather-card,.status-card,.notice-card,.emergency-card{padding-left:42px!important;padding-right:0!important}
.booking .row,.expense-item,.info-chip{gap:var(--ds-gap)!important}
.secondary-back,.section-top.compact{padding-left:0!important;padding-right:0!important}
.secondary-back button{color:var(--ds-red)!important;border-bottom-color:var(--ds-red)!important}

/* detail page: keep large green pass but use red as status only */
.boarding-ticket{background:var(--ds-green)!important;color:var(--ds-brown)!important}
.bt-status{color:var(--ds-red)!important;border-bottom-color:var(--ds-red)!important}
.bt-status.is-done{background:var(--ds-red)!important;color:var(--ds-bg)!important;border-bottom:0!important;padding:6px 9px!important}

/* v28 — breathing room + sage surface contrast */
:root{
  --ds-warmgray:#D8D2C8;
  --ds-warmgray-2:#CFC8BD;
  --ds-inner:9px;
}

/* ------------------------------------------------
   1. Consistent inner inset:
   no label/number should visually stick to a rule.
------------------------------------------------- */
.system-head-no{
  padding-left:var(--ds-inner)!important;
}
.system-head-main{
  padding-left:2px;
}
.system-head-meta{
  padding-right:var(--ds-inner)!important;
}

.editorial-filters{
  padding-left:var(--ds-inner)!important;
  padding-right:var(--ds-inner)!important;
}
.editorial-filters .filter:first-child{
  grid-column:2!important;
}

/* index rows keep the same grid, but contents sit inside it */
.editorial-index-row{
  padding-left:var(--ds-inner)!important;
  padding-right:var(--ds-inner)!important;
}
.editorial-index-no{
  padding-left:3px!important;
  padding-top:3px!important;
}
.editorial-index-main{
  padding-left:3px!important;
}
.editorial-index-date{
  padding-right:2px!important;
}
.editorial-index-arrow{
  padding-right:2px!important;
}

/* MORE uses exactly the same breathing rule */
.system-tool-row{
  padding-left:var(--ds-inner)!important;
  padding-right:var(--ds-inner)!important;
}
.system-tool-no{
  padding-left:3px!important;
}
.system-tool-main{
  padding-left:3px!important;
}

/* secondary rows should not begin directly on their guide column */
.booking,.talk-card,.task,.maybe-card,.expense-item,.info-chip,
.weather-card,.status-card,.notice-card,.emergency-card{
  padding-left:calc(42px + var(--ds-inner))!important;
  padding-right:var(--ds-inner)!important;
}

/* ------------------------------------------------
   2. PLAN: larger internal inset, especially numbers.
------------------------------------------------- */
.plan-rail .pass-sheet{
  padding:22px 22px 20px!important;
}
.pass-head{
  padding:0 3px!important;
}
.pass-eyebrow{
  display:inline-block;
  padding-left:2px!important;
}
.pass-date{
  margin-top:9px!important;
  padding-left:1px!important;
}
.pass-day{
  padding-right:2px!important;
}
.pass-route,.pass-meta{
  padding-left:3px!important;
  padding-right:3px!important;
}
.pass-perf{
  margin-left:-22px!important;
  margin-right:-22px!important;
}

/* event times used to sit too close to the left rule */
.pass-event{
  grid-template-columns:58px minmax(0,1fr) 18px!important;
  gap:11px!important;
  padding:11px 10px!important;
}
.pass-time{
  padding:2px 0 0 3px!important;
}
.pass-event>span:nth-child(2){
  padding-left:2px!important;
}
.pass-event i{
  padding-right:2px!important;
}
.pass-bottom{
  padding-left:3px!important;
  padding-right:3px!important;
}

/* PLAN top/control labels also receive inset */
.plan-swipe-top{
  padding-left:var(--ds-inner)!important;
  padding-right:var(--ds-inner)!important;
}
.plan-scroll-controls{
  padding-left:var(--ds-inner)!important;
  padding-right:var(--ds-inner)!important;
}

/* ------------------------------------------------
   3. Never place a white/cream floating box on sage.
   Sage -> warm gray / brown control language.
------------------------------------------------- */
#today .snap-rail,
.plan-rail,
.boarding-ticket{
  background:var(--ds-green)!important;
}

/* neutral floating controls on sage = warm gray */
#today .rail-pill:not(.dark),
.plan-rail .pass-event,
.boarding-ticket .bt-meta span,
.boarding-ticket .bt-grid>div{
  background:var(--ds-warmgray)!important;
  color:var(--ds-brown)!important;
  border-color:rgba(67,23,5,.16)!important;
}

/* darker action buttons on sage = brown + cream */
#today .rail-pill.dark,
.plan-scroll-btn,
.boarding-ticket .bt-status{
  background:var(--ds-brown)!important;
  color:var(--ds-bg)!important;
  border-color:var(--ds-brown)!important;
}
#today .rail-pill.dark *,
.plan-scroll-btn *,
.boarding-ticket .bt-status *{
  color:inherit!important;
  -webkit-text-fill-color:currentColor!important;
}

/* active/status signal remains red, but only as a small accent */
.boarding-ticket .bt-status.is-done,
.plan-scroll-btn:not(:disabled):active{
  background:var(--ds-red)!important;
  color:var(--ds-bg)!important;
  border-color:var(--ds-red)!important;
}

/* Today utility cells: warm gray instead of bright cream boxes */
.utility-strip{
  background:var(--ds-warmgray)!important;
}
.utility-strip button{
  background:transparent!important;
  color:var(--ds-brown)!important;
  border-color:rgba(67,23,5,.18)!important;
}

/* secondary light panels can use warm gray rather than white cards */
.booking-memo,
.note-card,
.input-card,
.detail-memo,
.light-memo{
  background:rgba(216,210,200,.48)!important;
}

/* splash: avoid cream card floating directly over sage */
.splash-front{
  background:var(--ds-warmgray)!important;
  color:var(--ds-brown)!important;
}
.splash-chip{
  background:var(--ds-brown)!important;
  color:var(--ds-bg)!important;
  border-color:var(--ds-brown)!important;
}

/* ------------------------------------------------
   4. Mobile grid corrections.
------------------------------------------------- */
@media(max-width:560px){
  :root{--ds-inner:8px}
  .booking,.talk-card,.task,.maybe-card,.expense-item,.info-chip,
  .weather-card,.status-card,.notice-card,.emergency-card{
    padding-left:calc(34px + var(--ds-inner))!important;
  }
  .plan-rail .pass-sheet{
    padding:20px 18px 18px!important;
  }
  .pass-perf{
    margin-left:-18px!important;
    margin-right:-18px!important;
  }
  .pass-event{
    grid-template-columns:54px minmax(0,1fr) 16px!important;
    padding:11px 9px!important;
  }
}


/* v29 — line-based user hyperlink manager */
.user-links-section{
  margin-top:14px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.user-links-head{
  min-height:46px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 var(--ds-inner);
  border-bottom:1px solid var(--line);
}
.user-links-head>span{
  font-size:10px;
  font-weight:600;
  letter-spacing:.12em;
}
.user-links-head>button{
  min-height:36px;

  color:var(--ds-red);
  font-size:10px;
  font-weight:600;

}
.user-link-empty{

.user-link-list{display:grid}

.user-link-editor{

.user-link-editor[hidden]{display:none!important}
.user-link-editor label{

.user-link-editor label:first-child{margin-top:0}
.user-link-editor label>span{

@media(max-width:560px){
  .user-link-row{grid-template-columns:1fr}
  .user-link-tools{

/* v30 — stripped, flat, no decoration */

.stub-actions button,.stub-actions a,.bt-status,.user-link-row,.user-link-editor,

/* ==========================================================
   v36 — COBALT LONGFORM
   off-white + cobalt only / vertical document UI
========================================================== */
:root{
  --v36-bg:#F4F2EC;
  --v36-paper:#F8F7F2;
  --v36-blue:#1845F5;
  --v36-blue-soft:rgba(24,69,245,.52);
  --v36-blue-faint:rgba(24,69,245,.07);
  --v36-ink:#1845F5;
  --v36-muted:#7D86A8;
  --v36-font:"Pretendard","Helvetica Neue",Arial,-apple-system,BlinkMacSystemFont,sans-serif;
  --atlas-bg:var(--v36-bg);
  --atlas-paper:var(--v36-paper);
  --atlas-blue:var(--v36-blue);
  --atlas-yellow:var(--v36-paper);
}
html,body{
  background:var(--v36-bg)!important;
  color:var(--v36-blue)!important;
  overflow-x:hidden!important;
}
body{
  font-family:var(--v36-font)!important;
  font-weight:400!important;
}
.app{
  width:min(100%,760px)!important;
  padding:0 16px 110px!important;
  margin:0 auto!important;
}
.view{overflow:visible!important}
button,a,input,textarea,select{font-family:var(--v36-font)!important}

/* remove previous horizontal UI completely */
.editorial-slider,.editorial-rail,.editorial-slider-footer,
.plan-editorial-slider,.plan-editorial-footer,.snap-rail,
.index-hero,.yellow-index-hero,.atlas-list,.more-editorial-page,
.archive-detail,.archive-back,.archive-hero,.archive-image,.archive-quick-grid,.archive-section{
  max-width:100%!important;
}
#today .editorial-slider,#plan .editorial-slider{display:none!important}

/* all old green/yellow/red surfaces are neutralized */
.tone-yellow,.yellow-index-hero,.splash-chip,.color-red,.color-yellow,.color-lav,.color-pink,.color-mint,.color-sand,.color-black,.color-blue{
  background:transparent!important;

/* MORE */

.v36-detail-nav{

}

.secondary-back button,.section-title,.section-top .kicker,

}
.money-total *{color:inherit!important;-webkit-text-fill-color:currentColor!important}

/* splash — no yellow */
.splash-screen{background:var(--v36-bg)!important}

.splash-front{background:var(--v36-paper)!important;color:var(--v36-blue)!important}

}

/* kill legacy lines where possible */
.head-rule,.ed-rule,.editorial-progress,.plan-scroll-track{display:none!important}

}

}

/* natural page scrolling only */
#today,#plan,#spots,#eat,#more,#detail{
  min-height:auto!important;
  overflow:visible!important;
}
body{overscroll-behavior-y:auto!important}

/* iOS */
button *,a *{-webkit-text-fill-color:currentColor!important}

@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

  .app{padding-left:14px!important;padding-right:14px!important}
  .v36-next{

  .v36-detail-facts{grid-template-columns:1fr 1fr;gap:14px}

/* =========================================================
   v39 — COBALT BLOCKS
   Reference-led: flat cobalt blocks, strict grid, large type
========================================================= */
:root{
  --v39-bg:#F4F2EC;
  --v39-paper:#F8F7F2;
  --v39-blue:#1746F5;
  --v39-blue-deep:#1038CF;
  --v39-blue-soft:rgba(23,70,245,.54);
  --v39-blue-faint:rgba(23,70,245,.06);
  --v39-white:#F8F7F2;
  --v39-grid-gap:10px;
  --v39-gutter:14px;
  --v39-font:"Pretendard","Helvetica Neue",Arial,-apple-system,BlinkMacSystemFont,sans-serif;
}
html,body{
  background:var(--v39-bg)!important;
  color:var(--v39-blue)!important;
}
body{
  font-family:var(--v39-font)!important;
  font-weight:400!important;
  line-height:1.45!important;
}
.app{
  width:min(100%,760px)!important;
  margin:0 auto!important;
  padding:0 var(--v39-gutter) 104px!important;
}
button,a,input,textarea,select{font-family:var(--v39-font)!important}
*{box-shadow:none!important;text-shadow:none!important;font-style:normal!important}

/* shared page grid */
.v39-page{
  width:100%;
  padding-top:calc(16px + env(safe-area-inset-top));
}
.v39-page-head{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  column-gap:var(--v39-grid-gap);
  padding:4px 0 34px;
}
.v39-eyebrow{
  grid-column:1/-1;
  display:flex;
  justify-content:space-between;
  gap:16px;
  font-size:9px;
  line-height:1.3;
  font-weight:500;
  color:var(--v39-blue-soft);
}
.v39-page-title{
  grid-column:1/-1;
  margin-top:34px;
  font-size:clamp(58px,17vw,116px);
  line-height:.82;
  letter-spacing:-.085em;
  font-weight:500;
}
.v39-filter{
  grid-column:1/-1;
  display:flex;
  gap:20px;
  margin-top:28px;
}
.v39-filter button{
  padding:0;
  border:0;
  background:transparent!important;
  color:var(--v39-blue-soft)!important;
  font-size:9px;
  font-weight:500;
}
.v39-filter button.active{color:var(--v39-blue)!important}

/* PLAN blue cards */
.v39-plan-list{
  display:grid;
  gap:20px;
  padding-bottom:38px;
}
.v39-plan-card{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  column-gap:var(--v39-grid-gap);
  min-height:520px;
  padding:16px;
  background:var(--v39-blue);
  color:var(--v39-white);
  border-radius:0;
}
.v39-plan-card *{
  color:inherit!important;
  -webkit-text-fill-color:currentColor!important;
}
.v39-plan-card-head{
  grid-column:1/-1;
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-size:9px;
  line-height:1.3;
  font-weight:500;
  opacity:.7;
}
.v39-plan-date{
  grid-column:1/-1;
  margin-top:28px;
  font-size:clamp(72px,22vw,148px);
  line-height:.82;
  letter-spacing:-.09em;
  font-weight:500;
}
.v39-plan-name{
  grid-column:1/-1;
  margin-top:10px;
  font-size:clamp(27px,7vw,42px);
  line-height:1;
  letter-spacing:-.055em;
  font-weight:500;
}
.v39-plan-place{
  grid-column:1/4;
  margin-top:8px;
  font-size:10px;
  line-height:1.5;
  opacity:.66;
}
.v39-plan-events{
  grid-column:1/-1;
  align-self:end;
  display:grid;
  gap:0;
  margin-top:32px;
}
.v39-plan-event{
  width:100%;
  display:grid;
  grid-template-columns:54px minmax(0,1fr) 18px;
  gap:10px;
  align-items:start;
  padding:11px 0;
  border:0;
  background:transparent!important;
  color:inherit!important;
  text-align:left;
}
.v39-plan-event + .v39-plan-event{
  border-top:1px solid rgba(248,247,242,.18);
}
.v39-plan-time{
  font-size:10px;
  line-height:1.4;
  opacity:.62;
}
.v39-plan-copy b{
  display:block;
  font-size:15px;
  line-height:1.25;
  font-weight:500;
}
.v39-plan-copy small{
  display:block;
  margin-top:5px;
  font-size:9px;
  line-height:1.45;
  opacity:.62;
}
.v39-plan-arrow{
  text-align:right;
  font-size:12px;
}
.v39-plan-foot{
  grid-column:1/-1;
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin-top:18px;
  padding-top:12px;
  font-size:9px;
  line-height:1.35;
  opacity:.62;
}

/* SPOTS / EAT blocks */
.v39-index-head{padding-bottom:26px}
.v39-item-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:var(--v39-grid-gap);
  padding-bottom:38px;
}
.v39-item-card{
  aspect-ratio:.92/1;
  min-width:0;
  display:flex;
  flex-direction:column;
  padding:13px;
  border:0;
  background:var(--v39-blue)!important;
  color:var(--v39-white)!important;
  text-align:left;
  overflow:hidden;
}
.v39-item-card *{
  color:inherit!important;
  -webkit-text-fill-color:currentColor!important;
}
.v39-item-top,
.v39-item-bottom{
  display:flex;
  justify-content:space-between;
  gap:10px;
  width:100%;
}
.v39-item-top{
  font-size:8px;
  line-height:1.3;
  font-weight:500;
  opacity:.62;
}
.v39-item-top i,.v39-item-bottom i{
  font-style:normal!important;
}
.v39-item-name{
  margin-top:34px;
  max-width:96%;
  font-size:clamp(22px,6vw,34px);
  line-height:.98;
  letter-spacing:-.055em;
  font-weight:500;
  word-break:keep-all;
}
.v39-item-cn{
  margin-top:8px;
  font-size:10px;
  line-height:1.4;
  opacity:.68;
}
.v39-item-bottom{
  margin-top:auto;
  align-items:flex-end;
  font-size:8px;
  line-height:1.35;
  opacity:.66;
}
.v39-item-card.is-done{opacity:.42}

/* MORE */
.v39-more-grid{
  display:grid;
  gap:4px;
  padding-bottom:38px;
}
.v39-more-row{
  width:100%;
  display:grid;
  grid-template-columns:34px minmax(0,1fr) 18px;
  gap:12px;
  align-items:center;
  padding:16px 0;
  border:0;
  background:transparent!important;
  color:var(--v39-blue)!important;
  text-align:left;
}
.v39-more-row:nth-child(odd){
  background:var(--v39-blue-faint)!important;
  margin-left:-8px;
  margin-right:-8px;
  width:calc(100% + 16px);
  padding-left:8px;
  padding-right:8px;
}
.v39-more-row>span:first-child{
  font-size:9px;
  color:var(--v39-blue-soft);
}
.v39-more-row b{
  display:block;
  font-size:clamp(24px,6.5vw,38px);
  line-height:1;
  letter-spacing:-.05em;
  font-weight:500;
}
.v39-more-row small{
  display:block;
  margin-top:6px;
  font-size:9px;
  line-height:1.4;
  color:var(--v39-blue-soft);
}
.v39-more-row>span:last-child{
  text-align:right;
  font-size:13px;
}

/* TODAY: strict grid + blue NEXT, keep v38 collision-safe stack */
.v38-today{
  display:block!important;
  min-height:auto!important;
  padding-top:calc(16px + env(safe-area-inset-top))!important;
}
.v38-today .v37-today-hero{
  display:grid!important;
  grid-template-columns:repeat(4,minmax(0,1fr))!important;
  column-gap:var(--v39-grid-gap)!important;
  padding:4px 0 46px!important;
}
.v38-today .v36-overline{
  grid-column:1/-1!important;
}
.v38-today .v36-hero-word,
.v38-today .v36-hero-title,
.v38-today .v36-hero-meta{
  grid-column:1/-1!important;
}
.v38-today .v36-hero-word{
  margin-top:50px!important;
  font-size:clamp(56px,17vw,110px)!important;
  line-height:.9!important;
}
.v38-today .v36-hero-title{
  margin-top:22px!important;
  line-height:1.16!important;
}
.v38-next{
  width:100%!important;
  margin:0!important;
  padding:18px!important;
  min-height:310px!important;
  background:var(--v39-blue)!important;
  display:flex!important;
  flex-direction:column!important;
  color:var(--v39-white)!important;
}
.v38-next-head{
  width:100%!important;
}
.v38-next-time{
  margin-top:46px!important;
  font-size:clamp(50px,14vw,76px)!important;
}
.v38-next-title{
  margin-top:18px!important;
  font-size:clamp(26px,7vw,38px)!important;
  line-height:1.12!important;
}
.v38-next-sub{
  margin-top:10px!important;
  line-height:1.5!important;
}
.v38-next-title + .v38-next-sub{margin-bottom:auto!important}
.v37-route{
  padding-top:38px!important;
}
.v37-route-row{
  padding:7px 0!important;
}

/* detail page: calmer, blue headers + soft blocks, fewer lines */
.v36-detail,
.v37-detail{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));

.v36-detail-head,
.v36-detail-image,
.v36-detail-facts,

.v36-detail-title{

/* shared field block — fixes the left-edge sticking */

.v40-field-card textarea{

/* booking links same inset system */

/* MONEY hero: pure blue field, no old burst/symbol decoration */
.v40-money-total{

/* Budget + split grids: actual gutters between cards, safe internal padding */
.v40-budget-grid,
.v40-split-grid{

}

}

/* Split title spacing */
.v40-split-head{

}
.v40-split-head .section-title{
  margin-top:12px!important;

  line-height:.9!important;
}

/* Split add action: no text hugging edge */
.v40-add-card{
  min-height:96px!important;

  align-items:flex-end!important;
  padding:14px var(--v40-inset) 16px!important;

}
.v40-add-card .inline-btn{

/* Split totals */
.v40-split-summary{
  display:grid!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  gap:var(--v40-gap)!important;
  margin-top:var(--v40-gap)!important;
}

/* Expense items — explicit inner inset prevents left wall sticking */
.v40-expense-list{
  display:grid!important;
  gap:var(--v40-gap)!important;
  margin-top:var(--v40-gap)!important;
  padding-bottom:28px!important;
}
#money .expense-item{

  display:flex!important;
  justify-content:space-between!important;
  align-items:center!important;
  gap:18px!important;
  background:rgba(23,70,245,.055)!important;
  border:0!important;
  border-radius:0!important;
  color:var(--v39-blue)!important;
}
#money .expense-item .left,
#money .expense-item .right{
  min-width:0!important;
  margin:0!important;
  padding:0!important;
}
#money .expense-item .left b{
  font-size:15px!important;
  line-height:1.35!important;
  font-weight:500!important;
}
#money .expense-item .left span{
  margin-top:5px!important;
  font-size:9px!important;
  line-height:1.35!important;
  color:var(--v39-blue-soft)!important;
}
#money .expense-item .right{
  text-align:right!important;
}
#money .expense-item .right strong{
  font-size:17px!important;
  line-height:1.25!important;
  font-weight:500!important;
}
#money .expense-item .right button{
  margin-top:6px!important;
  padding:0!important;
  border:0!important;
  background:transparent!important;
  color:var(--v39-blue-soft)!important;
  font-size:9px!important;
}
.v40-empty-state{
  margin:0!important;
  padding:18px var(--v40-inset)!important;
  background:rgba(23,70,245,.055)!important;
  color:var(--v39-blue-soft)!important;
  font-size:11px!important;
  line-height:1.5!important;
}

/* override any ancient 0-padding or left-only padding rules */
#money .input-card,
#money .info-chip,
#money .note-card,
#money .expense-item,
#book .booking-memo,
#book .booking-links-section{
  padding-left:var(--v40-inset)!important;
  padding-right:var(--v40-inset)!important;
}

/* no legacy masks / bursts / decorative pseudo symbols in money */
#money .money-total::before,
#money .money-total::after,
#money .input-card::before,
#money .input-card::after,
#money .info-chip::before,
#money .info-chip::after{
  content:none!important;
  display:none!important;
}

/* mobile: split fields can stack without squeezing labels */
@media(max-width:560px){
  :root{--v40-inset:14px;--v40-gap:8px}

  .v40-booking{
    padding-left:var(--v40-inset)!important;
    padding-right:var(--v40-inset)!important;
  }

  .v40-budget-grid{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
  .v40-split-grid{

  }

  .v40-money-info,
  .v40-split-summary{
    grid-template-columns:1fr 1fr!important;
  }

  .v40-field-card input{
    font-size:clamp(22px,7vw,30px)!important;
  }
}

/* v45 redesign — pastel box editorial system */
:root{
  --v45-bg:#161718;
  --v45-bg-2:#1e2022;
  --v45-surface:#f8f6f1;
  --v45-surface-2:#efede8;
  --v45-ink:#121314;
  --v45-muted:rgba(18,19,20,.64);
  --v45-line:rgba(18,19,20,.12);

function getTodayData(){const now=new Date();const start=new Date('2026-08-25T00:00:00');const end=new Date('2026-08-29T23:59:59');
  if(now < start){const diff=Math.ceil((start-now)/(1000*60*60*24));return {mode:'countdown',label:`D-${diff}`,title:'여행 준비',day:DAYS[0],subtitle:'여행 전 준비 단계'};}
  if(now > end){return {mode:'done',label:'DONE',title:'여행 종료',day:DAYS[DAYS.length-1],subtitle:'여행 종료'};}
  const idx=Math.min(DAYS.length-1,Math.max(0,Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate())-new Date(2026,7,25))/(1000*60*60*24))));
  return {mode:'during',label:`DAY ${idx+1}`,title:DAYS[idx].name,day:DAYS[idx],subtitle:DAYS[idx].place};
}
function nextEventForDay(day){const now=new Date();const hh=String(now.getHours()).padStart(2,'0');const mm=String(now.getMinutes()).padStart(2,'0');const current=`${hh}:${mm}`;const timed=day.events.filter(e=>/^\d{2}:\d{2}$/.test(e[0]));return timed.find(e=>e[0]>=current)||timed[timed.length-1]||day.events[0]}

function safeLinkEditorId(scope,a,b=''){
  return `link-editor-${scope}-${String(a)}-${String(b)}`.replace(/[^a-zA-Z0-9_-]/g,'_');
}
function getStoredLinks(scope,a,b=''){
  if(scope==='booking'){

  }
  state.detailLinks=state.detailLinks||{spot:{},food:{}};

  return state.detailLinks[a][b]||[];
}
function setStoredLinks(scope,a,b,list){
  if(scope==='booking'){
    state.bookingLinks=state.bookingLinks||{};
    state.bookingLinks[a]=list;
  }else{
    state.detailLinks=state.detailLinks||{spot:{},food:{}};
    state.detailLinks[a]=state.detailLinks[a]||{};
    state.detailLinks[a][b]=list;
  }
  save();

function normalizeUserUrl(raw){
  let url=String(raw||'').trim();
  if(!url) return '';
  if(/^\/\//.test(url)) return 'https:'+url;
  if(/^[a-z][a-z0-9+.-]*:/i.test(url)) return url;
  return 'https://'+url;
}
function isUnsafeUserUrl(url){
  return /^(javascript|data|vbscript|file):/i.test(String(url||'').trim());
}
function defaultLinkName(url){
  try{
    const u=new URL(url);
    return u.hostname.replace(/^www\./,'')||'LINK';
  }catch(e){
    const scheme=(String(url).match(/^([a-z][a-z0-9+.-]*):/i)||[])[1];
    return scheme?scheme.toUpperCase():'LINK';
  }
}
function openStoredLink(scope,a,b,index){
  const item=getStoredLinks(scope,a,b)[index];
  if(!item) return;
  const url=normalizeUserUrl(item.url);
  if(!url||isUnsafeUserUrl(url)) return toast('INVALID LINK');
  if(/^https?:/i.test(url)){
    const w=window.open(url,'_blank','noopener,noreferrer');
    if(!w) window.location.href=url;
  }else{
    window.location.href=url;
  }
}
function toggleLinkEditor(scope,a,b=''){
  const el=document.getElementById(safeLinkEditorId(scope,a,b));
  if(!el) return;
  el.hidden=!el.hidden;
  if(!el.hidden){
    const name=el.querySelector('.user-link-name');
    if(name) setTimeout(()=>name.focus(),40);
  }
}
function clearLinkEditor(scope,a,b=''){
  const el=document.getElementById(safeLinkEditorId(scope,a,b));
  if(!el) return;
  el.dataset.editIndex='';
  const name=el.querySelector('.user-link-name');
  const url=el.querySelector('.user-link-url');
  const saveBtn=el.querySelector('.user-link-save');
  if(name) name.value='';
  if(url) url.value='';
  if(saveBtn) saveBtn.textContent='SAVE LINK';
}
function cancelLinkEditor(scope,a,b=''){
  clearLinkEditor(scope,a,b);
  const el=document.getElementById(safeLinkEditorId(scope,a,b));
  if(el) el.hidden=true;
}
function editStoredLink(scope,a,b,index){
  const item=getStoredLinks(scope,a,b)[index];
  const el=document.getElementById(safeLinkEditorId(scope,a,b));
  if(!item||!el) return;
  el.hidden=false;
  el.dataset.editIndex=String(index);
  el.querySelector('.user-link-name').value=item.name||'';
  el.querySelector('.user-link-url').value=item.url||'';
  el.querySelector('.user-link-save').textContent='UPDATE LINK';
  setTimeout(()=>el.querySelector('.user-link-name').focus(),40);
}
function saveStoredLink(scope,a,b=''){
  const el=document.getElementById(safeLinkEditorId(scope,a,b));
  if(!el) return;
  const url=normalizeUserUrl(el.querySelector('.user-link-url').value);
  if(!url) return toast('URL REQUIRED');
  if(isUnsafeUserUrl(url)) return toast('INVALID LINK');
  let name=el.querySelector('.user-link-name').value.trim();
  if(!name) name=defaultLinkName(url);
  const list=[...getStoredLinks(scope,a,b)];
  const editIndex=el.dataset.editIndex;
  const item={name,url};
  if(editIndex!=='' && Number.isInteger(Number(editIndex)) && list[Number(editIndex)]){
    list[Number(editIndex)]=item;
  }else{
    list.push(item);
  }
  setStoredLinks(scope,a,b,list);
  toast('LINK SAVED');
  if(scope==='booking') renderBook();
  else renderDetail(a,b,location.hash.split('/')[3]||'spots');
}
function removeStoredLink(scope,a,b,index){
  if(!confirm('이 링크를 삭제할까요?')) return;
  const list=[...getStoredLinks(scope,a,b)];
  list.splice(index,1);
  setStoredLinks(scope,a,b,list);
  if(scope==='booking') renderBook();
  else renderDetail(a,b,location.hash.split('/')[3]||'spots');
}
function moveStoredLink(scope,a,b,index,dir){
  const list=[...getStoredLinks(scope,a,b)];
  const target=index+dir;
  if(index<0||index>=list.length||target<0||target>=list.length) return;
  [list[index],list[target]]=[list[target],list[index]];
  setStoredLinks(scope,a,b,list);
  if(scope==='booking') renderBook();
  else renderDetail(a,b,location.hash.split('/')[3]||'spots');
}

    </main>`;
}
function weatherText(code){if(code===0)return '맑음';if([1,2,3].includes(code))return '구름';if([45,48].includes(code))return '안개';if([51,53,55,56,57].includes(code))return '이슬비';if([61,63,65,66,67,80,81,82].includes(code))return '비';if([71,73,75,77,85,86].includes(code))return '눈';if([95,96,99].includes(code))return '뇌우';return '확인 필요'}
async function loadWeather(force=false){const root=document.getElementById('weatherCards');if(!root)return;const cached=state.weatherCache;const fresh=cached&&Date.now()-cached.time<30*60*1000;if(cached&&!force){renderWeatherCards(cached);if(fresh)return}root.innerHTML='<div class="status-card">날씨 불러오는 중…</div>';try{const urls=[['충칭',29.563,106.5516],['우롱',29.325,107.76]];const rows=[];for(const [name,lat,lon] of urls){const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation,weather_code&timezone=Asia%2FShanghai`;const r=await fetch(u);if(!r.ok)throw new Error('weather');const j=await r.json();rows.push({name,...j.current})}state.weatherCache={time:Date.now(),rows};save();renderWeatherCards(state.weatherCache)}catch(e){root.innerHTML='<div class="status-card"><b>날씨를 불러오지 못했습니다.</b><br><span>인터넷 연결 후 다시 시도하세요. 캐시된 값이 있으면 마지막 값이 표시됩니다.</span></div>';if(cached)renderWeatherCards(cached)}}
function renderWeatherCards(cache){const root=document.getElementById('weatherCards');if(!root)return;root.innerHTML=cache.rows.map((w,i)=>`<article class="weather-card ${color(i+1)}"><div class="weather-name">${w.name}</div><div class="weather-temp">${Math.round(w.temperature_2m)}°</div><div class="weather-desc">${weatherText(w.weather_code)} · 체감 ${Math.round(w.apparent_temperature)}° · 강수 ${w.precipitation||0} mm</div></article>`).join('')+`<div class="weather-updated">마지막 확인: ${new Date(cache.time).toLocaleString('ko-KR')}</div>`}
function renderWeather(){document.getElementById('weather').innerHTML=`<div class="secondary-back"><button onclick="go('more')">← 더보기</button></div><div class="section-top compact"><div class="kicker">WEATHER · WULONG STATUS</div><h1 class="section-title">WEATHER</h1><p class="section-sub">온라인일 때 최신 날씨를 불러옵니다. 우롱 관광지 운영 여부는 공식 페이지에서 마지막으로 확인하세요.</p></div><div id="weatherCards" class="weather-grid"></div><div class="action-row"><button class="action-btn" onclick="loadWeather(true)">날씨 새로고침</button><a class="action-btn light" href="https://www.wlkst.com/" target="_blank" rel="noopener">우롱 공식 관광</a></div><div class="notice-card"><b>우롱 체크</b><span>천생삼교 · 용수협지봉 · 선녀산은 폭우 시 운영이 바뀔 수 있습니다. 출발 직전 공지를 우선 확인하세요.</span></div>`;loadWeather(false)}
function renderEmergency(){document.getElementById('emergency').innerHTML=`<div class="secondary-back"><button onclick="go('more')">← 더보기</button></div><div class="section-top compact"><div class="kicker">EMERGENCY</div><h1 class="section-title">EMERGENCY</h1><p class="section-sub">급할 때 바로 누르거나 복사할 정보만 모았습니다.</p></div><div class="emergency-grid"><a class="emergency-card color-red" href="tel:110"><span>경찰</span><strong>110</strong></a><a class="emergency-card color-yellow" href="tel:120"><span>구급</span><strong>120</strong></a><a class="emergency-card color-blue" href="tel:119"><span>소방</span><strong>119</strong></a></div><div class="talk-list"><div class="talk-card color-white"><div class="ko">도와주세요.</div><div class="zh">请帮帮我。</div><button class="inline-btn" onclick="copyText('请帮帮我。')">복사</button></div><div class="talk-card color-pink"><div class="ko">병원에 가야 해요.</div><div class="zh">我需要去医院。</div><button class="inline-btn" onclick="copyText('我需要去医院。')">복사</button></div><div class="talk-card color-mint"><div class="ko">경찰을 불러주세요.</div><div class="zh">请帮我报警。</div><button class="inline-btn" onclick="copyText('请帮我报警。')">복사</button></div></div><div class="notice-card"><b>민감정보</b><span>여권번호·카드번호 같은 정보는 이 앱 메모에 저장하지 않는 것을 권장합니다.</span></div>`}
