<style>
@import url('https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css');
:root{
  /* Reference palette: CHARCOAL / WARM GREEN / SAGE / GREY / LIME */
  --charcoal:#2E2D2D;
  --warm-green:#ACB77A;
  --sage:#D1E2BE;
  --grey:#F8F7F2;
  --lime:#E8F985;
  --bg:var(--grey);
  --paper:var(--grey);
  --ink:var(--charcoal);
  --muted:rgba(46,45,45,.62);
  --line:rgba(46,45,45,.10);
  /* Legacy color tokens remapped so the existing layout/logic stays untouched. */
  --red:var(--charcoal);
  --yellow:var(--lime);
  --blue:var(--warm-green);
  --lav:var(--sage);
  --pink:var(--lime);
  --mint:var(--sage);
  --sand:var(--grey);
  --black:var(--charcoal);
  --white:var(--grey);
  --shadow:0 14px 34px rgba(46,45,45,.10);
  --r-xl:34px;
  --r-lg:28px;
  --r-md:22px;
  --english:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}

img{max-width:100%;display:block}

.view{display:none}.view.active{display:block}
.page-top{padding:calc(22px + env(safe-area-inset-top)) 0 16px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.en-title,.big-en,.nav-label,.chip,.mini-title{font-family:var(--english)}
.hero-title{margin:8px 0 0;font-family:var(--english);font-size:clamp(42px,11vw,74px);line-height:.88;letter-spacing:-.07em;font-weight:900}

.grid{display:grid;gap:14px}

.color-red{background:var(--red);color:var(--grey)}.color-yellow{background:var(--yellow)}.color-blue{background:var(--blue)}.color-lav{background:var(--lav)}.color-pink{background:var(--pink)}.color-mint{background:var(--mint)}.color-sand{background:var(--sand)}.color-black{background:var(--black);color:var(--grey)}.color-white{background:var(--white)}

.detail-top{padding:calc(20px + env(safe-area-inset-top)) 0 16px}.back{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border-radius:999px;background:var(--grey);box-shadow:var(--shadow);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.detail-card{margin-top:14px;padding:20px;border-radius:34px;box-shadow:var(--shadow)}

.detail-card .name{font-family:var(--english);font-size:clamp(38px,10vw,66px);line-height:.9;letter-spacing:-.06em;font-weight:900;margin-top:10px}

/* v9 UX overrides */
body{font-size:16px}
.section-title{font-family:var(--english);font-size:clamp(36px,10vw,56px);font-weight:900;letter-spacing:-.06em;line-height:.94}

/* v17 — CHARCOAL foreground contrast rules
   Any component using the charcoal token (legacy .color-red / .color-black)
   must use light text throughout. */
.catalog-card.color-red,
.catalog-card.color-black{
  color:var(--grey);
}
.catalog-card.color-red .catalog-name,
.catalog-card.color-black .catalog-name,
.catalog-card.color-red .catalog-cn,
.catalog-card.color-black .catalog-cn,
.catalog-card.color-red .catalog-en,
.catalog-card.color-black .catalog-en,
.catalog-card.color-red .catalog-meta,
.catalog-card.color-black .catalog-meta{
  color:var(--grey);
}
.catalog-card.color-red .catalog-chip,
.catalog-card.color-black .catalog-chip{
  background:rgba(248,247,242,.16);
  color:var(--grey);
}
.catalog-card.color-red .catalog-arrow,
.catalog-card.color-black .catalog-arrow{
  background:var(--grey);
  color:var(--charcoal);
}

.more-card.color-red,
.more-card.color-black{
  color:var(--grey);
}
.more-card.color-red .more-title,
.more-card.color-black .more-title,
.more-card.color-red .more-sub,
.more-card.color-black .more-sub{
  color:var(--grey);
}
.more-card.color-red .more-sub,
.more-card.color-black .more-sub{
  opacity:.78;
}
.more-card.color-red .more-arrow,
.more-card.color-black .more-arrow{
  background:var(--grey);
  color:var(--charcoal);
}

/* Keep the same contrast behavior if charcoal cards are reused in other lists. */
.booking.color-red,
.booking.color-black,
.maybe-card.color-red,
.maybe-card.color-black,
.quick-btn.color-red,
.quick-btn.color-black{
  color:var(--grey);
}
.booking.color-red .type,
.booking.color-red .title,
.booking.color-red .meta,
.booking.color-black .type,
.booking.color-black .title,
.booking.color-black .meta,
.maybe-card.color-red .type,
.maybe-card.color-red .title,
.maybe-card.color-red .sub,
.maybe-card.color-black .type,
.maybe-card.color-black .title,
.maybe-card.color-black .sub{
  color:var(--grey);
}


/* v20 — iOS Safari / standalone PWA text color hardening for TODAY + PLAN.
   WebKit can apply its control text fill color inside clickable buttons even when
   the parent button inherits the intended CSS color. Force text-fill to follow
   each element's resolved currentColor without changing the visual hierarchy. */
#today button,
#today button *,
#plan button,
#plan button *{
  -webkit-text-fill-color:currentColor !important;
}

/* Explicit base colors for the clickable components used on these two screens. */
#today .quick-btn{
  color:var(--charcoal) !important;
}
#today .quick-btn .mini-title,
#today .quick-btn p{
  color:var(--muted) !important;
}
#today .action-btn.light{
  color:var(--charcoal) !important;
}
#today .action-btn{
  -webkit-text-fill-color:currentColor !important;
}

#plan .day-card:not(.color-red):not(.color-black) .event.clickable{
  color:var(--charcoal) !important;
}
#plan .day-card.color-red .event.clickable,
#plan .day-card.color-black .event.clickable{
  color:var(--grey) !important;
}
#plan .event.clickable .time,
#plan .event.clickable .title,
#plan .event.clickable .sub{
  color:inherit !important;
  -webkit-text-fill-color:currentColor !important;
}


/* v21 — Travel note redesign: vivid ticket palette + swipe decks */
:root{
  --charcoal:#111111;
  --grey:#F7F4ED;

  --muted:rgba(17,17,17,.62);

  --red:#FF5A36;
  --yellow:#F0FF62;
  --blue:#5D7CFF;
  --lav:#B68DFF;
  --pink:#FF6EA9;
  --mint:#65E36C;
  --sand:#FFD687;
  --warm-green:#65E36C;
  --sage:#D9F2C8;
  --lime:#F0FF62;

html{background:var(--paper)}
body{background:

.bottom-nav{background:rgba(17,17,17,.96);border-radius:30px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));box-shadow:0 18px 40px rgba(0,0,0,.22)}

.travel-shell{display:grid;gap:14px}

/* v24 — native snap UX + warm white / warm gray / lemon */
:root{
  --bg:#F1EFE9;
  --paper:#F7F5F0;
  --warm:#DDD9CF;
  --warm-2:#CFCBC1;
  --lemon:#E7F15A;
  --ink:#1F1F1B;
  --muted:rgba(31,31,27,.60);
  --line:rgba(31,31,27,.13);
  --grey:var(--paper);
  --charcoal:var(--ink);
  --blue:var(--lemon);
  --blue-2:#A7B300;
  --shadow:0 10px 24px rgba(54,52,46,.09),0 1px 0 rgba(255,255,255,.55) inset;
}
html{background:var(--bg)}
body{background:linear-gradient(180deg,#F3F1EB 0%,#ECE9E1 100%);color:var(--ink);font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.app{width:min(100%,760px);padding:0 16px 126px;color:var(--ink)}
.section-sub,.hero-sub{display:none!important}
.page-minimal-head{padding:calc(22px + env(safe-area-inset-top)) 0 12px}
.micro-label{font-family:var(--english);font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--muted)}
.minimal-title{margin:7px 0 0;font-family:var(--english);font-size:clamp(46px,12vw,76px);line-height:.84;letter-spacing:-.08em;font-weight:900;color:var(--ink)}
.head-rule{height:1px;background:var(--ink);opacity:.16;margin-top:14px}
.bottom-nav{background:rgba(31,31,27,.94);border:0;box-shadow:0 14px 36px rgba(31,31,27,.18)}
.nav-btn{color:rgba(247,245,240,.62)}
.nav-btn.active{background:var(--lemon);color:var(--ink)}
.nav-btn i{font-size:14px}.nav-btn .nav-label{font-size:8px;letter-spacing:.12em}

/* stable native horizontal snap */
.snap-shell{margin-top:2px}
.snap-rail{display:flex;gap:12px;overflow-x:auto;overflow-y:visible;padding:8px 14px 18px 2px;scroll-snap-type:x mandatory;scroll-padding-inline:2px;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none}
.snap-rail::-webkit-scrollbar{display:none}

/* plan cards: no absolute positioning, no pointer capture */

.detail-image-frame{width:100%;aspect-ratio:16/9;margin-top:16px;border-radius:20px;overflow:hidden;background:var(--warm-2);-webkit-mask-image:none!important;mask-image:none!important}.detail-image-frame img{width:100%;height:100%;object-fit:cover}.detail-image-frame.fallback{display:grid;place-items:center;font-family:var(--english);font-size:24px;font-weight:900;letter-spacing:.12em;color:rgba(31,31,27,.35)}
.bt-perf{margin:18px -18px 14px;border-top:1px dashed rgba(31,31,27,.30)}.bt-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.bt-grid>div{min-height:64px;padding:10px;border-radius:15px;background:rgba(255,255,255,.30);border:1px solid rgba(31,31,27,.07)}.bt-grid span{display:block;font-family:var(--english);font-size:8px;font-weight:800;letter-spacing:.12em;color:rgba(31,31,27,.55)}.bt-grid b{display:block;margin-top:6px;font-size:11px;line-height:1.35;word-break:break-word}.bt-status{width:100%;min-height:44px;margin-top:12px;border-radius:15px;background:var(--ink);color:var(--paper);font-size:11px;font-weight:850;letter-spacing:.08em}
.stub-panel{background:var(--paper);border:1px solid rgba(31,31,27,.08);border-radius:24px;padding:15px;color:var(--ink);box-shadow:var(--shadow)}.stub-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding-bottom:11px;border-bottom:1px solid rgba(31,31,27,.11);font-family:var(--english);font-size:10px;font-weight:800;letter-spacing:.13em}.stub-panel p{margin:12px 0 0;font-size:14px;line-height:1.62;color:var(--ink)!important}.stub-panel ul{margin:12px 0 0;padding-left:18px;display:grid;gap:7px}.stub-panel li{font-size:14px;line-height:1.5;color:var(--ink)!important}.stub-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.stub-actions button,.stub-actions a{min-height:46px;border-radius:14px;background:var(--warm);border:1px solid rgba(31,31,27,.08);display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:11px;font-weight:800;color:var(--ink)!important}.light-memo{width:100%;min-height:130px;margin-top:12px;border-radius:15px;border:1px solid rgba(31,31,27,.10);background:#ECE9E1;color:var(--ink);padding:12px;font-size:13px;line-height:1.6}.light-memo::placeholder{color:rgba(31,31,27,.40)}

/* v25 — reference palette + editorial serif titles + swipe-first PLAN */
:root{
  --ref-cream:#F0EEEB;
  --ref-sage:#BAC5BB;
  --ref-brown:#431705;
  --ref-coral:#F73D37;
  --bg:var(--ref-cream);
  --paper:var(--ref-cream);
  --warm:var(--ref-sage);
  --lemon:var(--ref-coral);
  --ink:var(--ref-brown);
  --charcoal:var(--ref-brown);
  --grey:var(--ref-cream);
  --blue:var(--ref-coral);
  --blue-2:var(--ref-brown);
  --muted:rgba(67,23,5,.58);
  --line:rgba(67,23,5,.14);
  --display-serif:"Iowan Old Style","Palatino Linotype","Book Antiqua","Noto Serif KR","AppleMyungjo",Georgia,serif;
  --body-sans:"Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
  --shadow:0 10px 24px rgba(67,23,5,.08),0 1px 0 rgba(255,255,255,.45) inset;
}
html{background:var(--ref-cream)!important}
body{background:var(--ref-cream)!important;color:var(--ref-brown)!important;font-family:var(--body-sans)!important;font-weight:450}
.app{color:var(--ref-brown)!important}

/* display typography */
.minimal-title,.hero-title,.section-title,.snap-big,.snap-title,.pass-date,.pass-route,.index-name,.bt-title,.booking .title,.maybe-card .title,.money-total .num,.weather-temp{
  font-family:var(--display-serif)!important;
  font-weight:700!important;
  letter-spacing:-.045em!important;
}
.minimal-title{font-size:clamp(48px,13vw,80px)!important;line-height:.86!important}
.pass-date{font-size:48px!important;line-height:.9!important}
.pass-route{font-size:29px!important;line-height:1.02!important}
.index-name{font-size:clamp(21px,5.6vw,28px)!important;line-height:1.05!important}
.bt-title{font-size:clamp(36px,9vw,54px)!important;line-height:.95!important}
.micro-label,.pass-eyebrow,.pass-day,.pass-time,.index-top,.index-en,.index-bottom,.tool-num,.tool-main small,.snap-foot,.booking .type,.booking .code,.stub-head,.bt-top,.bt-meta,.bt-grid,.nav-label,.filter,.rail-pill,.plan-swipe-top,.plan-scroll-controls{font-family:var(--body-sans)!important;font-weight:600!important}

/* exact palette */
.tone-paper{background:var(--ref-cream)!important;color:var(--ref-brown)!important}
.tone-warm{background:var(--ref-sage)!important;color:var(--ref-brown)!important}
.tone-lemon{background:var(--ref-coral)!important;color:var(--ref-cream)!important}
.tone-lemon *{color:inherit!important;-webkit-text-fill-color:currentColor!important}
.tone-lemon .pass-event,.tone-lemon .rail-pill{background:rgba(240,238,235,.14)!important;border-color:rgba(240,238,235,.22)!important;color:var(--ref-cream)!important}
.tone-lemon .pass-event small,.tone-lemon .pass-meta{color:rgba(240,238,235,.76)!important}
.tone-lemon .pass-perf,.tone-lemon .pass-bottom{border-color:rgba(240,238,235,.28)!important}
.tone-paper .pass-event,.tone-warm .pass-event{background:rgba(240,238,235,.46)!important;border-color:rgba(67,23,5,.08)!important;color:var(--ref-brown)!important}
.tone-paper .pass-event small,.tone-warm .pass-event small,.tone-paper .pass-meta,.tone-warm .pass-meta{color:rgba(67,23,5,.62)!important}

/* legacy colored surfaces constrained to four-color system */
.color-red,.color-lav{background:var(--ref-coral)!important;color:var(--ref-cream)!important}
.color-blue,.color-pink,.color-black{background:var(--ref-sage)!important;color:var(--ref-brown)!important}
.color-yellow,.color-mint,.color-white,.color-sand{background:var(--ref-cream)!important;color:var(--ref-brown)!important}
.color-red *,.color-lav *{color:inherit!important;-webkit-text-fill-color:currentColor!important}
.color-blue *,.color-pink *,.color-black *,.color-yellow *,.color-mint *,.color-white *,.color-sand *{color:inherit!important;-webkit-text-fill-color:currentColor!important}

/* NAV */
.bottom-nav{background:rgba(67,23,5,.96)!important;box-shadow:0 14px 34px rgba(67,23,5,.18)!important}
.nav-btn{color:rgba(240,238,235,.62)!important}
.nav-btn.active{background:var(--ref-coral)!important;color:var(--ref-cream)!important}

/* PLAN: horizontal swipe is primary */
.plan-head{padding-bottom:4px}
.plan-snap{margin-top:0;overflow:visible}
.plan-swipe-top{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px;color:var(--ref-brown);font-size:10px;letter-spacing:.13em}
.plan-swipe-word{display:inline-flex;align-items:center;gap:8px}.plan-swipe-word:after{content:'→';font-size:16px;color:var(--ref-coral)}
.plan-rail{gap:12px!important;padding:8px 38px 18px 2px!important;scroll-snap-type:x mandatory!important;scroll-padding-left:2px!important;touch-action:pan-x pan-y!important;overscroll-behavior-inline:contain!important;cursor:grab}
.plan-rail.is-dragging{cursor:grabbing;scroll-snap-type:none!important;user-select:none}
.plan-rail .pass-sheet{flex:0 0 min(82vw,520px)!important;scroll-snap-align:start!important;scroll-snap-stop:normal!important}
.plan-scroll-track{height:3px;background:rgba(67,23,5,.12);border-radius:999px;overflow:hidden;margin:0 4px 10px}
.snap-progress-fill{display:block;width:20%;height:100%;background:var(--ref-coral);border-radius:inherit;transition:width .18s ease}
.plan-scroll-controls{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px;padding:0 2px;color:rgba(67,23,5,.58);font-size:9px;letter-spacing:.14em;text-align:center}
.plan-scroll-btn{width:42px;height:42px;border-radius:999px;background:var(--ref-brown);color:var(--ref-cream)!important;font-size:17px;display:grid;place-items:center}
.plan-scroll-btn:disabled{opacity:.24}

/* filters & controls */
.filter{background:var(--ref-cream)!important;color:var(--ref-brown)!important;border-color:rgba(67,23,5,.12)!important}
.filter.active{background:var(--ref-brown)!important;color:var(--ref-cream)!important}
.rail-pill.dark,.inline-btn,.action-btn{background:var(--ref-brown)!important;color:var(--ref-cream)!important}
.rail-pill:not(.dark),.action-btn.light{background:var(--ref-cream)!important;color:var(--ref-brown)!important;border-color:rgba(67,23,5,.14)!important}

/* indexes */
.index-card{border-color:rgba(67,23,5,.10)!important}
.index-card.tone-lemon .index-en,.index-card.tone-lemon .index-bottom{color:rgba(240,238,235,.78)!important}
.index-card.tone-warm .index-en,.index-card.tone-warm .index-bottom,.index-card.tone-paper .index-en,.index-card.tone-paper .index-bottom{color:rgba(67,23,5,.62)!important}

/* secondary pages / contrast */
.secondary-back button,.back,.booking,.input-card,.info-chip,.note-card,.expense-item,.talk-card,.task,.maybe-card,.weather-card,.status-card,.notice-card,.emergency-card,.detail-section,.stub-panel{background:var(--ref-cream)!important;color:var(--ref-brown)!important;border-color:rgba(67,23,5,.10)!important}
.booking *,.input-card *,.info-chip *,.note-card *,.expense-item *,.talk-card *,.task *,.maybe-card *,.weather-card *,.status-card *,.notice-card *,.emergency-card *,.detail-section *,.stub-panel *{color:inherit!important;-webkit-text-fill-color:currentColor!important}
.money-total{background:var(--ref-coral)!important;color:var(--ref-cream)!important}
.money-total *{color:inherit!important;-webkit-text-fill-color:currentColor!important}

/* detailed ticket: deep-brown main pass + cream/sage stubs */
.detail-page-light{color:var(--ref-brown)!important}
.boarding-ticket{background:var(--ref-brown)!important;color:var(--ref-cream)!important;border-color:rgba(67,23,5,.12)!important}
.boarding-ticket *{color:inherit!important;-webkit-text-fill-color:currentColor!important}
.boarding-ticket .detail-image-frame{background:var(--ref-cream)!important;border-color:rgba(240,238,235,.16)!important}
.boarding-ticket .bt-meta span,.boarding-ticket .bt-grid>div,.boarding-ticket .bt-status{background:rgba(240,238,235,.10)!important;border-color:rgba(240,238,235,.16)!important;color:var(--ref-cream)!important}
.boarding-ticket .bt-status{background:var(--ref-coral)!important;border-color:var(--ref-coral)!important}
.stub-panel:nth-of-type(even){background:var(--ref-sage)!important}
.stub-panel::before{background:var(--ref-coral)!important}
.stub-actions button,.stub-actions a{background:var(--ref-brown)!important;color:var(--ref-cream)!important;border:0!important}
.light-memo{background:rgba(67,23,5,.05)!important;color:var(--ref-brown)!important;border-color:rgba(67,23,5,.10)!important}
.light-memo::placeholder{color:rgba(67,23,5,.42)!important}

/* splash */
.splash-screen{background:var(--ref-cream)!important}
.splash-back{background:var(--ref-sage)!important}

function weatherText(code){if(code===0)return '맑음';if([1,2,3].includes(code))return '구름';if([45,48].includes(code))return '안개';if([51,53,55,56,57].includes(code))return '이슬비';if([61,63,65,66,67,80,81,82].includes(code))return '비';if([71,73,75,77,85,86].includes(code))return '눈';if([95,96,99].includes(code))return '뇌우';return '확인 필요'}
async function loadWeather(force=false){const root=document.getElementById('weatherCards');if(!root)return;const cached=state.weatherCache;const fresh=cached&&Date.now()-cached.time<30*60*1000;if(cached&&!force){renderWeatherCards(cached);if(fresh)return}root.innerHTML='<div class="status-card">날씨 불러오는 중…</div>';try{const urls=[['충칭',29.563,106.5516],['우롱',29.325,107.76]];const rows=[];for(const [name,lat,lon] of urls){const u=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,precipitation,weather_code&timezone=Asia%2FShanghai`;const r=await fetch(u);if(!r.ok)throw new Error('weather');const j=await r.json();rows.push({name,...j.current})}state.weatherCache={time:Date.now(),rows};save();renderWeatherCards(state.weatherCache)}catch(e){root.innerHTML='<div class="status-card"><b>날씨를 불러오지 못했습니다.</b><br><span>인터넷 연결 후 다시 시도하세요. 캐시된 값이 있으면 마지막 값이 표시됩니다.</span></div>';if(cached)renderWeatherCards(cached)}}
function renderWeatherCards(cache){const root=document.getElementById('weatherCards');if(!root)return;root.innerHTML=cache.rows.map((w,i)=>`<article class="weather-card ${color(i+1)}"><div class="weather-name">${w.name}</div><div class="weather-temp">${Math.round(w.temperature_2m)}°</div><div class="weather-desc">${weatherText(w.weather_code)} · 체감 ${Math.round(w.apparent_temperature)}° · 강수 ${w.precipitation||0} mm</div></article>`).join('')+`<div class="weather-updated">마지막 확인: ${new Date(cache.time).toLocaleString('ko-KR')}</div>`}

function initSnapRail(id){
  const root=document.getElementById(id); if(!root) return;
  const rail=root.querySelector('.snap-rail');
  const dots=[...root.querySelectorAll('.snap-dot')];
  const count=root.querySelector('.snap-count');
  const progress=root.querySelector('.snap-progress-fill');
  const prev=root.querySelector('[data-snap-prev]');
  const next=root.querySelector('[data-snap-next]');
  if(!rail) return;
  const cards=[...rail.children];
  let active=0, raf=0;

  const cardLeft=(i)=>Math.max(0,cards[i].offsetLeft-rail.offsetLeft-2);
  const goTo=(i,behavior='smooth')=>{
    const target=Math.max(0,Math.min(cards.length-1,i));
    rail.scrollTo({left:cardLeft(target),behavior});
  };
  const update=()=>{
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const center=rail.scrollLeft+rail.clientWidth/2;
      let best=0,dist=Infinity;
      cards.forEach((card,i)=>{const c=card.offsetLeft-rail.offsetLeft+card.offsetWidth/2;const d=Math.abs(c-center);if(d<dist){dist=d;best=i}});
      active=best;
      dots.forEach((dot,i)=>dot.classList.toggle('active',i===active));
      if(count) count.textContent=`${String(active+1).padStart(2,'0')} / ${String(cards.length).padStart(2,'0')}`;
      if(progress) progress.style.width=`${((active+1)/cards.length)*100}%`;
      if(prev) prev.disabled=active===0;
      if(next) next.disabled=active===cards.length-1;
    });
  };

  rail.addEventListener('scroll',update,{passive:true});
  dots.forEach((dot,i)=>dot.onclick=()=>goTo(i));
  if(prev) prev.onclick=()=>goTo(active-1);
  if(next) next.onclick=()=>goTo(active+1);

  // Desktop: click-and-drag. Touch devices keep native scrolling, avoiding scroll jank.
  let dragging=false,startX=0,startScroll=0,pid=null;
  rail.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.target.closest('button,a,input,textarea,select,label')) return;
    dragging=true;pid=e.pointerId;startX=e.clientX;startScroll=rail.scrollLeft;rail.classList.add('is-dragging');
    try{rail.setPointerCapture(pid)}catch(_){ }
  });
  rail.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==pid)return;rail.scrollLeft=startScroll-(e.clientX-startX)});
  const endDrag=()=>{dragging=false;rail.classList.remove('is-dragging')};
  rail.addEventListener('pointerup',endDrag);rail.addEventListener('pointercancel',endDrag);
  update();
}

function initCardDeck(id,start=0){
  const root=document.getElementById(id); if(!root) return;
  const stage=root.querySelector('.deck-stage'); if(!stage) return;
  const cards=[...stage.querySelectorAll('.deck-card')]; if(!cards.length) return;
  let current=Math.max(0,Math.min(start,cards.length-1));
  let dragging=false,startX=0,dx=0,pointerId=null;
  const interactiveSel='button,a,textarea,input,select,label';
  const paint=()=>{
    cards.forEach((card,i)=>{
      const diff=(i-current+cards.length)%cards.length;
      card.classList.remove('is-top','is-next','is-third','is-hidden');
      card.style.opacity='1';
      card.style.pointerEvents='auto';
      if(diff===0){card.classList.add('is-top'); card.style.transform=`translate3d(${dx}px,0,0) rotate(${dx/20}deg) scale(1)`;}
      else if(diff===1){card.classList.add('is-next'); card.style.transform='translate3d(0,18px,0) scale(.97)';}
      else if(diff===2){card.classList.add('is-third'); card.style.transform='translate3d(0,34px,0) scale(.94)';}
      else{card.classList.add('is-hidden'); card.style.transform='translate3d(0,52px,0) scale(.91)'; card.style.opacity='.05'; card.style.pointerEvents='none';}
    });
    root.querySelectorAll('.deck-dot').forEach((d,i)=>d.classList.toggle('active',i===current));
  };
  const commit=(dir)=>{dx=0;dragging=false;if(dir==='next') current=(current+1)%cards.length; else if(dir==='prev') current=(current-1+cards.length)%cards.length;cards.forEach(c=>c.classList.remove('dragging'));paint();};
  const reset=()=>{dx=0;dragging=false;cards.forEach(c=>c.classList.remove('dragging'));paint();};
  stage.onpointerdown=(e)=>{if(e.target.closest(interactiveSel)) return;dragging=true;pointerId=e.pointerId;startX=e.clientX;dx=0;const top=cards[current]; if(top){top.classList.add('dragging'); try{top.setPointerCapture(pointerId)}catch(_){}}};
  stage.onpointermove=(e)=>{if(!dragging||e.pointerId!==pointerId) return;dx=e.clientX-startX;paint();};
  stage.onpointerup=(e)=>{if(!dragging||e.pointerId!==pointerId) return;if(dx<-70) commit('next'); else if(dx>70) commit('prev'); else reset();};
  stage.onpointercancel=reset;
  root.querySelectorAll('[data-dir]').forEach(btn=>btn.onclick=()=>commit(btn.dataset.dir));
  root.querySelectorAll('.deck-dot').forEach(btn=>btn.onclick=()=>{current=Number(btn.dataset.go)||0; reset();});
  paint();
}


function initSplash(){
  const splash=document.getElementById('splashScreen');
  if(!splash) return;
  const seen=sessionStorage.getItem('cqSplashSeen');
  if(seen){splash.classList.add('is-hidden'); setTimeout(()=>splash.remove(),420); return;}
  document.body.classList.add('splash-lock');
  requestAnimationFrame(()=>splash.classList.add('is-active'));
  setTimeout(()=>{
    splash.classList.add('is-hidden');
    document.body.classList.remove('splash-lock');
    sessionStorage.setItem('cqSplashSeen','1');
    setTimeout(()=>splash.remove(),560);
  },1050);
}

function route(){const hash=(location.hash||'#today').slice(1);const p=hash.split('/');if(p[0]==='detail'){renderDetail(p[1],p[2],p[3]);show('detail');nav(p[3]||'plan');return}
  const view=['today','plan','spots','eat','book','money','talk','check','maybe','more','weather','emergency'].includes(p[0])?p[0]:'today';
  if(view==='today') renderToday();
  if(view==='plan') renderPlan();
  if(view==='spots') renderSpots();
  if(view==='eat') renderEat();
  if(view==='book') renderBook();
  if(view==='money') renderMoney();
  if(view==='talk') renderTalk();
  if(view==='check') renderCheck();
  if(view==='maybe') renderMaybe();
  if(view==='more') renderMore();
  if(view==='weather') renderWeather();
  if(view==='emergency') renderEmergency();
  show(view); nav(view);
}
window.addEventListener('hashchange',route); route(); initSplash();
